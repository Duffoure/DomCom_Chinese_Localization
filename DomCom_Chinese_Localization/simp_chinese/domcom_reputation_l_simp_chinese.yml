l_simp_chinese:
 domcom_reputation_emerging:0 "初露头角"
 domcom_reputation_emerging_desc:0 "该角色的行事风格已开始引起人们的注意。声誉强度：[CHARACTER.MakeScope.Var('domcom_reputation_strength').GetValue|0]/100。"
 domcom_reputation_established:0 "小有名气"
 domcom_reputation_established_desc:0 "关于该角色的事迹已在当事人之外的人群中流传开来。声誉强度：[CHARACTER.MakeScope.Var('domcom_reputation_strength').GetValue|0]/100。"
 domcom_reputation_renowned:0 "名声在外"
 domcom_reputation_renowned_desc:0 "未曾谋面的人们可能已根据听到的传闻对其做出反应。声誉强度：[CHARACTER.MakeScope.Var('domcom_reputation_strength').GetValue|0]/100。"
 domcom_reputation_legendary:0 "名动一方"
 domcom_reputation_legendary_desc:0 "该角色过往的行事风格本身已演变为一项不可忽视的政治事实。声誉强度：[CHARACTER.MakeScope.Var('domcom_reputation_strength').GetValue|0]/100。"
 domcom_reputation_mythic:0 "传奇声誉"
 domcom_reputation_mythic_desc:0 "该角色几乎已成为世人眼中其自身形象的代名词。声誉强度：100/100。"
 domcom_archetype_paramour:0 "风流情圣"
 domcom_archetype_paramour_desc:0 "以强大的吸引力、追求手腕、持久的亲密纽带以及将他人自愿吸引至身边而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_paramour').GetValue|0]/100。"
 domcom_archetype_patron:0 "慷慨庇护者"
 domcom_archetype_patron_desc:0 "以在物质上提携、奖赏与庇护附属于其内宅的人员而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_patron').GetValue|0]/100。确立声誉的庇护者可以向其他角色赐予庇护。"
 domcom_archetype_guardian:0 "坚毅守护者"
 domcom_archetype_guardian_desc:0 "以亲自营救被掠走、受胁迫或无力自救之人而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_guardian').GetValue|0]/100。"
 domcom_archetype_liberator:0 "解放者"
 domcom_archetype_liberator_desc:0 "以打破奴役与压迫体系而闻名，即使其中并不涉及收回个人财产。得分：[CHARACTER.MakeScope.Var('domcom_rep_liberator').GetValue|0]/100。"
 domcom_archetype_restorer:0 "光复者"
 domcom_archetype_restorer_desc:0 "以归还被掠夺的人员、头衔或政治地位，而非据为己有而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_restorer').GetValue|0]/100。"
 domcom_archetype_champion:0 "正义捍卫者"
 domcom_archetype_champion_desc:0 "以自愿代表弱小阵营或统治者介入艰难的防御战争而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_champion').GetValue|0]/100。"
 domcom_archetype_dynast:0 "宗族兴盛者"
 domcom_archetype_dynast_desc:0 "以跨越世代保护、教育、分封与壮大家族而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_dynast').GetValue|0]/100。"
 domcom_archetype_breaker:0 "粉碎者"
 domcom_archetype_breaker_desc:0 "以接连战胜、羞辱并粉碎挑战者而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_breaker').GetValue|0]/100。"
 domcom_archetype_predator:0 "掠食者"
 domcom_archetype_predator_desc:0 "以不顾他人意愿强行夺取人员、机遇与筹码而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_predator').GetValue|0]/100。"
 domcom_archetype_overlord:0 "专制霸主"
 domcom_archetype_overlord_desc:0 "以逼迫他人公开服从并将个人支配转化为政治顺从而闻名。得分：[CHARACTER.MakeScope.Var('domcom_rep_overlord').GetValue|0]/100。"
 domcom_archetype_warhound:0 "好战猎犬"
 domcom_archetype_warhound_desc:0 "以寻求有价值的战争而闻名，纯粹为了战斗本身而介入冲突，而非出于道德考量。得分：[CHARACTER.MakeScope.Var('domcom_rep_warhound').GetValue|0]/100。"
 domcom_under_patronage:0 "处于庇护之下"
 domcom_under_patronage_desc:0 "一位声名显赫的庇护者正在资助并支持该角色的提升。"
 domcom_patronage_gratitude_opinion:0 "感激庇护之恩"
 domcom_bestow_patronage_interaction:0 "赐予庇护"
 domcom_bestow_patronage_interaction_desc:0 "运用你作为庇护者已确立的声誉提供持续的物质资助，而非仅仅发送一次性礼物。"
 domcom_bestow_patronage_gold_tt:0 "你需要 #V 150金币#! 来确立庇护关系。"
 domcom_bestow_patronage_toast:0 "已赐予庇护"
 DOMCOM_UI_PAGE_REPUTATION:0 "声誉"
 DOMCOM_UI_REPUTATION_TITLE:0 "声誉"
 DOMCOM_UI_REPUTATION_DESC:0 "支配机制会密切留意你的反复行事。它不会替代CK3的性格特质：施虐狂角色依然可以成为守护者，而慈悲的统治者也能成为专制霸主。你最显著的行为模式只有在确立明显优势后，才会成为公认的形象标签。"
 DOMCOM_UI_REPUTATION_STRENGTH:0 "#V 声誉强度：#! [GetPlayer.MakeScope.Var('domcom_reputation_strength').GetValue|0] / 100"
 DOMCOM_UI_REPUTATION_STRENGTH_TT:0 "#V 10 — 初露头角#!\n#V 25 — 小有名气#!\n#V 50 — 名声在外#!\n#V 75 — 名动一方#!\n#V 100 — 传奇声誉#!\n\n强度衡量该行为模式被广泛知晓的程度，而非评判该行为的好坏。"
 DOMCOM_UI_REPUTATION_DOMINANT:0 "#V 公开身份：#!你当前最高的公认原型标签将作为修正显示在该角色上。"
 DOMCOM_UI_REPUTATION_DOMINANT_TT:0 "挑战原型必须领先当前公开原型至少 #V 8分#! 才能将其替换。这可防止在两种声誉不相上下时标签频繁闪烁。"
 DOMCOM_UI_REPUTATION_SCORES_TITLE:0 "行为原型"
 DOMCOM_UI_REPUTATION_NOTE:0 "声誉系统旨在观察自然行为而非要求额外的刷分。只有在CK3自身未提供充分表达该行为的方式时，才应存在新的操作。"
 DOMCOM_UI_REP_PARAMOUR:0 "#P 风流情圣#! — [GetPlayer.MakeScope.Var('domcom_rep_paramour').GetValue|0]/100"
 DOMCOM_UI_REP_PARAMOUR_TT:0 "通过持久的吸引力、成功的挑逗/服从关系以及重大的自愿亲密纽带提升。特意命名为风流情圣，以免与CK3原版的‘勾引者’特质冲突。"
 DOMCOM_UI_REP_PATRON:0 "#P 慷慨庇护者#! — [GetPlayer.MakeScope.Var('domcom_rep_patron').GetValue|0]/100"
 DOMCOM_UI_REP_PATRON_TT:0 "通过在物质上提携附属于你的角色提升。在庇护者声誉达到25且总声誉达到25时解锁‘赐予庇护’：消耗150金币，给予目标100金币以及为期五年的适度收入/威望支持。"
 DOMCOM_UI_REP_GUARDIAN:0 "#P 坚毅守护者#! — [GetPlayer.MakeScope.Var('domcom_rep_guardian').GetValue|0]/100"
 DOMCOM_UI_REP_GUARDIAN_TT:0 "通过成功的营救与保护行为提升。守护者的定义是挺身而出保护其身边之人，而非泛泛的善意。"
 DOMCOM_UI_REP_LIBERATOR:0 "#P 解放者#! — [GetPlayer.MakeScope.Var('domcom_rep_liberator').GetValue|0]/100"
 DOMCOM_UI_REP_LIBERATOR_TT:0 "专为真正的反奴役或反压迫行为保留。系统不会仅因某项带有强制性的行为可以被美化描述就授予此声誉。"
 DOMCOM_UI_REP_RESTORER:0 "#P 光复者#! — [GetPlayer.MakeScope.Var('domcom_rep_restorer').GetValue|0]/100"
 DOMCOM_UI_REP_RESTORER_TT:0 "通过将被掠夺的人员、头衔或地位归还他人而非据为己有而提升。"
 DOMCOM_UI_REP_CHAMPION:0 "#P 正义捍卫者#! — [GetPlayer.MakeScope.Var('domcom_rep_champion').GetValue|0]/100"
 DOMCOM_UI_REP_CHAMPION_TT:0 "通过自愿代表弱势方介入艰难的防御性冲突而提升。未来的‘战争契机’页面将能直接查找这些战争，无需逐个点击地图上的领地。"
 DOMCOM_UI_REP_DYNAST:0 "#P 宗族兴盛者#! — [GetPlayer.MakeScope.Var('domcom_rep_dynast').GetValue|0]/100"
 DOMCOM_UI_REP_DYNAST_TT:0 "通过对后代及宗族分支的持续投入提升：教育、合理的封地、保护以及家族延续。"
 DOMCOM_UI_REP_BREAKER:0 "#N 粉碎者#! — [GetPlayer.MakeScope.Var('domcom_rep_breaker').GetValue|0]/100"
 DOMCOM_UI_REP_BREAKER_TT:0 "通过接连的阿尔法交锋胜利、羞辱以及倾向于崩溃的支配提升。阿尔法交锋失利会削弱此气场。"
 DOMCOM_UI_REP_PREDATOR:0 "#N 掠食者#! — [GetPlayer.MakeScope.Var('domcom_rep_predator').GetValue|0]/100"
 DOMCOM_UI_REP_PREDATOR_TT:0 "通过绑架、强制索取以及不顾他人意愿掌握筹码而提升。"
 DOMCOM_UI_REP_OVERLORD:0 "#N 专制霸主#! — [GetPlayer.MakeScope.Var('domcom_rep_overlord').GetValue|0]/100"
 DOMCOM_UI_REP_OVERLORD_TT:0 "当个人支配演变为公开的政治服从时提升：庞大的舔舐网络、受束缚的统治者及类似结果。"
 DOMCOM_UI_REP_WARHOUND:0 "#V 好战猎犬#! — [GetPlayer.MakeScope.Var('domcom_rep_warhound').GetValue|0]/100"
 DOMCOM_UI_REP_WARHOUND_TT:0 "通过接连选择有价值或艰难的战争提升，因为战斗本身即是意义。这是普鲁士/斯巴达式的道路：既非固有善意，亦非固有掠食。"
 DOMCOM_UI_REPUTATION_CURRENT_TITLE:0 "当前公开声誉"
 DOMCOM_UI_REPUTATION_MILESTONES_TITLE:0 "知名度"
 DOMCOM_UI_REPUTATION_MILESTONES:0 "10 初露头角  ·  25 小有名气  ·  50 名声在外  ·  75 名动一方  ·  100 传奇"
 DOMCOM_UI_REP_GROUP_PROSOCIAL:0 "保护型 / 亲社会"
 DOMCOM_UI_REP_GROUP_MIXED:0 "社交型 / 军事型"
 DOMCOM_UI_REP_GROUP_COERCIVE:0 "强制型"
 DOMCOM_UI_REP_SWITCH_RULE:0 "#weak 只有当另一个原型的得分领先至少8分时，公开身份才会改变。#!"
