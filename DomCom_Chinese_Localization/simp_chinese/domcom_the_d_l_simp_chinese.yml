l_simp_chinese:
  DOMCOM_UI_PAGE_THE_D:0 "动态内宅"
  DOMCOM_UI_PAGE_WAR_BOARD:0 "战争沙盘"
  DOMCOM_UI_THE_D_TITLE:0 "动态内宅"
  DOMCOM_UI_THE_D_DESC:0 "你的内宅是一座网状社交圈，而非简单列表。每六十天，“动态内宅”机制会从你的配偶与已登记亲密伴侣中抽取最多三对，由她们真实的观点、性格和现有关系决定默契是转化为友谊，竞争是演变为宿怨，还是极度仇恨演变为真正的CK3谋杀谋划。"
  DOMCOM_UI_THE_D_SUMMARY:0 "#V 内宅动态记录：#! #P [GetPlayer.MakeScope.Var('domcom_d_positive_beats').GetValue|0] 正面#! / #N [GetPlayer.MakeScope.Var('domcom_d_negative_beats').GetValue|0] 敌对#! / #N [GetPlayer.MakeScope.Var('domcom_d_scheme_beats').GetValue|0] 谋划#!"
  DOMCOM_UI_THE_D_SUMMARY_TT:0 "“动态内宅”机制并不创造第二套人际玩法。它会在内宅背景与性格使其具有合理性时，推动CK3原版的友人、宿敌与谋杀谋划系统。为了保证性能，该轮次每60天仅限制评估三对关系。"
  DOMCOM_UI_THE_D_ROW_OPINION:0 "内宅成员 — 与内宅其余成员的关系在后台演变。"
  DOMCOM_UI_THE_D_ROW_BEATS:0 "原版人际关系决定结果"
  DOMCOM_UI_THE_D_NOTE:0 "现有的嫉妒机制依然有效。“动态内宅”机制将概念扩展至嫉妒之外：盟友可以结成，宿敌可以浮现，极具敌意的性格无需等待玩家手动触发脚本即可自行采取行动。"
  domcom_d_household_harmony:0 "内宅和睦"
  domcom_d_household_harmony_desc:0 "该角色最近在庇护者的内宅中建立了建设性的纽带。"
  domcom_d_household_tension:0 "内宅紧张"
  domcom_d_household_tension_desc:0 "庇护者内宅中的竞争已固化为持久的紧张关系。"
  domcom_d_household_blood_feud:0 "内宅血海深仇"
  domcom_d_household_blood_feud_desc:0 "内宅关系网络已变得足够危险，以至于该角色愿意寻求流血报复。"
  domcom_defiant_opposition_minor:0 "抗争对抗"
  domcom_defiant_opposition_minor_desc:0 "该角色选择反抗曾经的羞辱者，而非屈服。"
  domcom_defiant_opposition_major:0 "抗争对抗 — 处于劣势"
  domcom_defiant_opposition_major_desc:0 "该角色正在反抗一位比自己更强大的对手。这种无畏与必要性磨砺了其宫廷与军事努力。"
  domcom_defiant_opposition_desperate:0 "抗争对抗 — 绝地反抗巨兽"
  domcom_defiant_opposition_desperate_desc:0 "尽管实力悬殊，该角色仍选择反抗。绝望、协同与胆识使其比常规属性所显示的要危险得多。"
  DOMCOM_DEFIANCE_COALITION_WAR_NAME:0 "反抗[DEFENDER.GetShortUIName]的反抗同盟"
  DOMCOM_DEFIANCE_COALITION_VICTORY_DESC:0 "同盟打破了庇护者的威慑气场，赢得了重大威望与合法性的逆转。"
  DOMCOM_DEFIANCE_COALITION_WHITE_PEACE_DESC:0 "同盟幸存下来，证明了反抗是可能的。"
  DOMCOM_DEFIANCE_COALITION_DEFEAT_DESC:0 "庇护者粉碎了同盟，巩固了其统治地位。"
  DOMCOM_DEFIANCE_COALITION_INVALIDATED_DESC:0 "同盟已无法继续。"
  DOMCOM_UI_WAR_BOARD_TITLE:0 "战争沙盘"
  DOMCOM_UI_WAR_BOARD_DESC:0 "外交范围内的进行中战争。在多行中选择一方，必要时查看参与者，然后一并加入所选冲突。刷新与浏览绝不会产生未经请求的事件。"
  DOMCOM_UI_WAR_BOARD_TOKENS:0 "特殊干预机会：[GetPlayer.MakeScope.Var('domcom_intervention_tokens').GetValue|0] / 2"
  DOMCOM_UI_WB_REFRESH:0 "刷新"
  DOMCOM_UI_WB_REFRESH_TT:0 "重新扫描外交范围内的进行中战争。刷新不消耗资源且不会弹出窗口。"
  DOMCOM_UI_WB_SORT_SCORE:0 "战争分数"
  DOMCOM_UI_WB_SORT_SCORE_TT:0 "按进攻方战争分数排序。默认顺序优先显示进攻方陷入最深困境的战争。"
  DOMCOM_UI_WB_SORT_CLOSEST:0 "最为胶着"
  DOMCOM_UI_WB_SORT_CLOSEST_TT:0 "优先显示战争分数最接近0%的战争 — 即竞争最激烈的战争。"
  DOMCOM_UI_WB_SORT_IMBALANCE:0 "兵力差距"
  DOMCOM_UI_WB_SORT_IMBALANCE_TT:0 "按主要进攻方与防御方当前军事力量的差距排序。"
  DOMCOM_UI_WB_ROW_WAR:0 "进行中的战争"
  DOMCOM_UI_WB_ROW_SCORE:0 "战争分数"
  DOMCOM_UI_WB_ROW_ATTACKERS:0 "#N 进攻方#!"
  DOMCOM_UI_WB_ROW_DEFENDERS:0 "#P 防御方#!"
  DOMCOM_UI_WB_SELECTED:0 "已选择"
  DOMCOM_UI_WB_PARTICIPANTS:0 "参与者"
  DOMCOM_UI_WB_PARTICIPANTS_TT:0 "展开或折叠此场战争的完整参与者名单。"
  DOMCOM_UI_WB_ATTACKER_ROSTER:0 "进攻方阵营"
  DOMCOM_UI_WB_DEFENDER_ROSTER:0 "防御方阵营"
  DOMCOM_UI_WB_PICK_ATTACKER:0 "提议加入进攻方"
  DOMCOM_UI_WB_PICK_ATTACKER_TT:0 "选择此场战争的进攻方。稍后选择防御方将替换此选择。如果你已是主要进攻方的盟友，这将被视为普通盟友参战，不消耗特殊干预机会。"
  DOMCOM_UI_WB_PICK_DEFENDER:0 "提议加入防御方"
  DOMCOM_UI_WB_PICK_DEFENDER_TT:0 "选择此场战争的防御方。稍后选择进攻方将替换此选择。如果你已是主要防御方的盟友，这将被视为普通盟友参战，不消耗特殊干预机会。"
  DOMCOM_UI_WB_CLEAR:0 "清除"
  DOMCOM_UI_WB_JOIN_SELECTED:0 "提议加入所选战局"
  DOMCOM_UI_WB_JOIN_SELECTED_TT:0 "处理所有已选战争。普通盟友参战不受限制。非盟友的支配干预将消耗2次特殊干预机会之一；一旦用尽，后续的特殊选择将无法加入。"
  DOMCOM_UI_WB_BATCH_NOTE:0 "支持多选。#P 盟友参战#!免费；非盟友支配干预将消耗一次特殊机会。"
  DOMCOM_UI_WAR_BOARD_REPUTATION:0 "捍卫真正较弱的一方倾向于积累‘冠军’声誉；保护家人或伴侣亦可积累‘守护者’声誉。加入艰难的进攻可积累‘猎犬’声誉。对弱小目标落井下石会滋养‘掠食者’声誉。"
  DOMCOM_INTERVENTION_0001_T:0 "值得介入的战争？"
  DOMCOM_INTERVENTION_0001_DESC:0 "[domcom_intervention_attacker.GetShortUIName]与[domcom_intervention_defender.GetShortUIName]已处于交战状态。你并未收到邀请；但这正是要点所在。如果你进行干预，你的声誉将记录你选择的阵营以及这场战斗的悬殊程度。"
  DOMCOM_INTERVENTION_AID_DEFENDER:0 "加入[domcom_intervention_defender.GetShortUIName]的防御战。"
  DOMCOM_INTERVENTION_AID_ATTACKER:0 "加入[domcom_intervention_attacker.GetShortUIName]的进攻战。"
  DOMCOM_INTERVENTION_PASS:0 "不干预此战。"
  DOMCOM_INTERVENTION_0002_T:0 "未找到合适的战争"
  DOMCOM_INTERVENTION_0002_DESC:0 "目前外交范围内没有可以清晰提供给你的独立统治者战争。你的干预机会未被消耗。"
  DOMCOM_UI_WB_VISIBLE_NOTE:0 "显示最多6场战争"
  DOMCOM_UI_WB_SLOT1_MATCHUP:0 "[GetPlayer.MakeScope.Var('domcom_wb_slot1_attacker').GetCharacter.GetShortUIName]  对阵  [GetPlayer.MakeScope.Var('domcom_wb_slot1_defender').GetCharacter.GetShortUIName]"
  DOMCOM_UI_WB_SLOT1_SCORE:0 "[GetPlayer.MakeScope.Var('domcom_wb_slot1_score').GetValue|+=0]%"
