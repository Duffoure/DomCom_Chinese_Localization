  domcom_override.preference.randomize:0 "恢复自然偏好随机值"
  domcom_override.preference.randomize_tt:0 "放弃该类别中的当前偏好，并使用支配机制的正态分布生成新的偏好。实施卷在 CK3 自动生成的结果面板中隐藏。"
  domcom_override.preference_body_safe_tt:0 "这会改变角色#V更喜欢#!，而不是他们自己的身体、天赋等级或精通。"
  domcom_override.preference_breast_frame_tt:0 "这只会改变偏好的乳房丰满度。它#V 不会#!改变角色自身的身体。已有的偏好体型/下胸围会被保留。"
  domcom_override.back:0 "返回"
  trait_domcom_human_among_ai_trait:0 "人工智能中的人类"
  trait_domcom_human_among_ai_trait_desc:0 "这个角色的存在规模是普通统治者无法比拟的。名声特质本身现在立即赋予超人的身体、精神和战场能力：极端的恢复力、速度、心灵能力和战略军事力量。一场成功的遏制战争可以暂时抑制这些奖金三年。该特质可以从出生时就存在； 18 岁之前，生育能力仍然受到严格限制。"
  domcom_enable_human_among_ai_decision:0 "成为人工智能中的人类"
  domcom_enable_human_among_ai_decision_desc:0 "为该角色启用控制机制的可选超人模式。"
  domcom_enable_human_among_ai_decision_tooltip:0 "获得#VAI 中的人类#!特征及其能力包。"
  domcom_enable_human_among_ai_decision_confirm:0 "我站在模拟上方。"
  domcom_disable_human_among_ai_decision:0 "禁用人工智能中的人类"
  domcom_disable_human_among_ai_decision_desc:0 "移除该角色的控制机制超人模式。"
  domcom_disable_human_among_ai_decision_tooltip:0 "删除该特性及其维持的功率修正值。"
  domcom_disable_human_among_ai_decision_confirm:0 "让我回到普通的规则。"
  domcom_human_ai_freeze_time_decision:0 "冻结时间"
  domcom_human_ai_freeze_time_decision_desc:0 "走出普通因果关系足够长的时间，以执行三种超人强制行动，而不会产生正常的外交或威望后果。"
  domcom_human_ai_freeze_time_decision_tooltip:0 "获得#V3 个时间冻结费用#!。心灵感应命令、传送到我的法庭和要求提交消耗一次费用，而不是施加正常的反冲力。"
  domcom_human_ai_freeze_time_decision_confirm:0 "停止。"
  domcom_human_ai_break_prison_decision:0 "走出监狱"
  domcom_human_ai_break_prison_decision_desc:0 "酒吧、围墙和警卫都不是有意义的遏制措施。"
  domcom_human_ai_break_prison_decision_tooltip:0 "立即离开监狱。"
  domcom_human_ai_break_prison_decision_confirm:0 "离开。"
  domcom_human_ai_invite_apex_breed_decision:0 "邀请顶级女性进行繁殖"
  domcom_human_ai_invite_apex_breed_decision_desc:0 "邀请外交范围内每一位符合支配机制战略基因标准的合格顶尖女性。招聘本身没有支配年龄机制门；只有具有生育能力的成年新兵才能进入繁殖队列。"
  domcom_human_ai_invite_apex_breed_decision_tooltip:0 "搜索外交范围并邀请符合条件的 巅峰 女性。强烈支持接受，但不保证接受。接受的无土地女性加入你的宫廷。只有具有生育能力的成年新兵才能进入繁殖队列，每月最多接受两次受孕。"
  domcom_human_ai_invite_apex_breed_decision_confirm:0 "发送邀请函。"
  DOMCOM_HUMAN_AI_APEX_RESULT_TOAST:0 "巅峰 计划：[ROOT.Char.MakeScope.Var('domcom_human_ai_apex_accepted').GetValue|0]接受[ROOT.Char.MakeScope.Var('domcom_human_ai_apex_invited').GetValue|0]邀请。受孕将被交错进行（最多 2 次/月）。"
  domcom_human_ai_mind_read_interaction:0 "读心术"
  domcom_human_ai_mind_read_interaction_desc:0 "直接读取[recipient.GetShortUINamePossessive]的思想，揭示当前存储在[recipient.GetHerHim]和[recipient.GetHerHis]配偶身上的每个秘密。"
  domcom_human_ai_telepathic_command_interaction:0 "心灵感应命令"
  domcom_human_ai_telepathic_command_interaction_desc:0 "对[recipient.GetShortUIName]施加心灵命令，创建支配机制式的杠杆作用。如果没有冻结时间，这将被视为严重的精神侵犯。"
  domcom_human_ai_teleport_to_court_interaction:0 "传送到我的法庭"
  domcom_human_ai_teleport_to_court_interaction_desc:0 "立即将这个未登陆的角色转移到你的宫廷中。如果没有时间冻结指控，受害者会记得自己被视为与普通因果关系相反。"
  domcom_human_ai_demand_submission_interaction:0 "要求超人的服从"
  domcom_human_ai_demand_submission_interaction_desc:0 "迫使独立统治者承认人类之中的人工智能为宗主国。冻结时间可以消除直接的外交反弹。"
  DOMCOM_HUMAN_AI_CAPITULATION_TOAST:0 "[scope:domcom_human_ai_responder.GetShortUIName]屈服于威胁"
  DOMCOM_HUMAN_AI_CONTAINMENT_WAR_NAME:0 "针对[DEFENDER.GetShortUIName]的遏制战"
  DOMCOM_HUMAN_AI_CONTAINMENT_VICTORY_DESC:0 "联盟暂时遏制了超人的威胁。"
  DOMCOM_HUMAN_AI_CONTAINMENT_DEFEAT_DESC:0 "失败的挑战者成为超人统治者的朝贡者。"
  DOMCOM_HUMAN_AI_CONTAINMENT_WHITE_PEACE_DESC:0 "事实证明，双方都无法达成最终解决方案。"
  domcom_human_among_ai_power_modifier:0 "人工智能中的人类——超人的存在"
  domcom_human_among_ai_power_modifier_desc:0 "超人的耐力、速度、认知和战场存在感。军队乘数代表角色亲自充当战略武器； 控制机制不会产生隐藏军团。"
  domcom_human_ai_time_frozen_modifier:0 "时间冻结"
  domcom_human_ai_time_frozen_modifier_desc:0 "三种支配机制可以进行超人的强制动作，没有正常的反作用力。"
  domcom_human_ai_psychic_violation_opinion:0 "违背了我的心意"
  domcom_human_ai_forced_teleport_opinion:0 "把我从我的地方夺走"
  domcom_human_ai_submission_opinion:0 "强迫我提交"
  domcom_human_ai_awe_opinion:0 "对超人的敬畏"
  domcom_human_ai_contained_modifier:0 "暂时收容"
  domcom_human_ai_contained_modifier_desc:0 "尽管潜在的超人特征仍然存在，但联盟成功地造成了暂时的政治挫折。"
  game_concept_domcom_power_trip_v2:0 "征服远征"
  game_concept_domcom_power_trip_v2_desc:0 "一次超人远征进入另一个独立领域，以发泄权力、重塑其人口并强加新的政治秩序。"
  activity_domcom_power_trip_v2:0 "征服远征"
  activity_domcom_power_trip_v2_host_an_a:0 "一场"
  activity_domcom_power_trip_v2_host_desc:0 "前往独立王国并释放力量之旅。"
  activity_domcom_power_trip_v2_desc:0 "飞入另一个领域并释放你的力量。该领域的实际军事、领导力、发展、精英防御者、联盟、你积累的知识以及你当前的状况都会影响结果。"
  activity_domcom_power_trip_v2_province_desc:0 "只能选择您外交范围内的独立王国的首都。完成的 巡游威压 会开始 5 年的冷却时间。"
  game_concept_domcom_power_trip:0 "征服远征"
  game_concept_domcom_power_trip_desc:0 "一次超人远征进入另一个独立领域，以发泄权力、重塑其人口并强加新的政治秩序。"
  activity_domcom_power_trip:0 "征服远征"
  activity_domcom_power_trip_desc:0 "飞入另一个领域并释放你的力量。该领域的实际军事、领导力、发展、精英防御者、联盟、你积累的知识以及你当前的状况都会影响结果。"
  activity_domcom_power_trip_province_desc:0 "只能选择您外交范围内的独立王国的首都。完成的 巡游威压 会开始 5 年的冷却时间。"
  phase_domcom_power_trip:0 "释放"
  phase_domcom_power_trip_desc:0 "超人已经达到了目标境界并决定如何处理它。"
  domcom_power_trip.100.t:0 "断电：[scope:domcom_power_trip_target.GetPrimaryTitle.GetNameNoTier]"
  domcom_power_trip.100.desc:0 "您已到达[scope:domcom_power_trip_target.GetPrimaryTitle.GetNameNoTier]。他们真正的军事地位、领导力、发展、盟友、精锐战士、对你力量的了解以及你目前的状况已经产生了#P[ROOT.Char.MakeScope.Var('domcom_power_trip_success_chance').GetValue|0]%#!的完全成功机会。如果他们阻止你，他们目前发现#NGodsbane#!的预计机会是#N[ROOT.Char.MakeScope.Var('domcom_power_trip_godsbane_chance').GetValue|0]%#!，永远不会超过 25%。选择这将是哪种类型的动力之旅；接下来决定王国的政治命运。儿童永远不是屠杀目标。"
  domcom_power_trip.100.a:0 "播种新秩序"
  domcom_power_trip.100.a.tt:0 "消灭王国里合格的成年男子。幸存的成年女性必然受到支配机制的约束；符合资格的 巅峰 女性会进入交错的繁殖队列，这样您的血统就可以取代旧的顺序。"
  domcom_power_trip.100.b:0 "颠倒顺序"
  domcom_power_trip.100.b.tt:0 "相反，要消灭该领域合格的成年女性。幸存的成年男子成为顺从的替代者。儿童永远不是屠杀目标。"
  domcom_power_trip.100.c:0 "回家"
  domcom_power_trip.100.c.tt:0 "放弃征服，且不摧毁或奴役该领地"
  domcom_power_trip.100.d:0 "奴役全境"
  domcom_power_trip.100.d.tt:0 "利用活体市场整合奴役整个领地"
  domcom_power_trip.110.t:0 "领地将何去何从？"
  domcom_power_trip.110.desc:0 "远征本身已获胜。现在决定如何重塑其政治格局。"
  domcom_power_trip.110.a:0 "吞并领地"
  domcom_power_trip.110.a.tt:0 "将征服的领土保留在你的领地内。"
  domcom_power_trip.110.b:0 "建立纳贡关系"
  domcom_power_trip.110.b.tt:0 "将重组后的领地置于直辖之外，使其成为附庸/朝贡国。"
  domcom_power_trip.110.c:0 "吞并王国"
  domcom_power_trip.110.c.tt:0 "在大规模奴役之后，吞并该领域，因为没有自由的当地统治阶级可以保存。"
  domcom_power_trip.200.t:0 "饱了"
  domcom_power_trip.200.desc.default:0 "境界无法阻止你。[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]目标成年男性中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]被淘汰。幸存的成年女性服从度锁定为1000；符合资格的顶尖女性正在进入交错的繁殖队列，更替的政治秩序已经根据你选择的命运建立起来。三年来，普通事件不会给您带来有意义的压力。"
  domcom_power_trip.200.desc.inverse:0 "境界无法阻止你。[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]目标成年女性中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]被消除。幸存的成年男子被锁定在1000服从，最强大的幸存者已被用来重建政治秩序，并且王国已根据您的命令服从。三年来，普通事件不会给您带来有意义的压力。"
  domcom_power_trip.200.desc.enslave:0 "境界无法阻止你。[ROOT.Char.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]合格居民通过活奴隶制被奴役，每个俘虏都没有单独的弹出窗口。由于没有自由的当地统治阶级可以保护，土地被并入你的领地。三年来，普通事件不会给您带来有意义的压力。"
  domcom_power_trip.200.a:0 "这很有帮助。"
  domcom_power_trip.210.t:0 "人性的抵抗"
  domcom_power_trip.210.desc.default:0 "他们阻止了你——但只是在你撕裂了大部分领域之后。  在抵抗力量迫使你返回之前，[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]已被杀害。您获得两级压力并承受失败带来的伤害。世界已经从所发生的事情中吸取了教训。"
  domcom_power_trip.210.desc.captured:0 "他们在遭受惨重损失后阻止了你，并出乎意料地成功控制住了你。[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]首先死亡。您获得两个级别的压力。他们的围堵将压制你的逃生能力三年；如果他们能让你坚持那么久，当失败时你可能会再次退出。"
  domcom_power_trip.210.desc.godsbane:0 "抵抗组织存活了足够长的时间，足以部署比军队更糟糕的东西：#NGodsbane#!。[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]在对策生效之前死亡，但你的超自然包现在已被压制。世界仍然知道你是什么——名誉特质依然存在——但你的力量已经消失，直到控制机制提供一种方法来收回它们。"
  domcom_power_trip.210.desc.godsbane_captured:0 "不可能的事情发生了两次。抵抗力量围堵了你并部署了#NGodsbane#!。[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_killed').GetValue|0]首先死亡，但你的超自然包被压制，你现在是他们的囚犯。"
  domcom_power_trip.210.desc.enslave_default:0 "他们阻止了你，但在你将[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]符合条件的居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]奴役之前。你获得两级压力并承受失败战役的伤害。幸存者现在更加了解如何抵抗你。"
  domcom_power_trip.210.desc.enslave_captured:0 "在[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]符合条件的居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]被占领后，他们停止了奴役运动，然后又以某种方式控制了你。您获得两个级别的压力。他们的收容会抑制你的逃生能力三年。"
  domcom_power_trip.210.desc.enslave_godsbane:0 "仅在[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]名符合条件的居民中的[ROOT.Char.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]名被俘虏后，奴役运动才失败。抵抗组织还部署了#NGodsbane#!。你在 AI 中的人类名声特征仍然存在，但它的超自然包被抑制，直到你找到一种方法来收回它。"
  domcom_power_trip.210.desc.enslave_godsbane_captured:0 "他们抵抗了足够长的时间，在[ROOT.Char.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[ROOT.Char.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]合格居民被带走后停止了战役，然后完成了两次不可能的事情：#NGodsbane#!被部署，你被俘虏了。你的力量被压制，你现在是他们的囚犯。"
  domcom_power_trip.210.a:0 "他们会记住这一点。我也会。"
  domcom_power_trip.conclusion.aborted:0 "你选择不释放能量之旅。这个领域原封不动地幸存下来，而你则转身回家。"
  domcom_power_trip.conclusion.success.default:0 "境界无法阻止你。[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]目标成年男性中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]被淘汰。幸存的成年女性绑定支配机制，符合条件的顶尖女性进入繁殖队列，更替的政治秩序遵循你选择的命运。你已经满足三年了。"
  domcom_power_trip.conclusion.success.inverse:0 "境界无法阻止你。[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]目标成年女性中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]被消除。幸存的成年男子成为服从的替代秩序，而这个领域将遵循你选择的命运。你已经满足三年了。"
  domcom_power_trip.conclusion.success.enslave:0 "境界无法阻止你。[GetPlayer.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]合格居民通过生活市场系统被奴役。政治外壳被吸收到你的领域中。你已经满足三年了。"
  domcom_power_trip.conclusion.failure.default:0 "他们只是在遭受惨重损失后才阻止你。  在抵抗力量迫使你返回之前，[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]已死亡。你获得两级压力并承受失败带来的伤害。"
  domcom_power_trip.conclusion.failure.captured:0 "他们在遭受惨重损失后阻止了你，并以某种方式遏制了你。[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]首先死亡。你获得两级压力，它们的遏制会抑制你的逃生能力三年。"
  domcom_power_trip.conclusion.failure.godsbane:0 "他们存活了足够长的时间来部署#NGodsbane#!。[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]在对策生效之前死亡。你的名声依然存在，但你的超自然能力被压制了。"
  domcom_power_trip.conclusion.failure.godsbane_captured:0 "不可能的事情发生了两次：他们收容了你并部署了#NGodsbane#!。[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]选定居民中的[GetPlayer.MakeScope.Var('domcom_power_trip_killed').GetValue|0]首先死亡。你的力量被压制，你成为他们的囚犯。"
  domcom_power_trip.conclusion.failure.enslave_default:0 "他们停止了这场运动，但只是在[GetPlayer.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]合格居民被奴役之后。你获得两级压力并承受失败带来的伤害。"
  domcom_power_trip.conclusion.failure.enslave_captured:0 "在[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]名合格居民中的[GetPlayer.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]名被带走后，他们停止了奴役运动，然后以某种方式收容了你。他们的收容会抑制你的逃生能力三年。"
  domcom_power_trip.conclusion.failure.enslave_godsbane:0 "在[GetPlayer.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]名合格居民被占领后，他们停止了奴役运动，然后部署了#N神克星#!。你的名声依然存在，但你的超自然能力被压制了。"
  domcom_power_trip.conclusion.failure.enslave_godsbane_captured:0 "他们在[GetPlayer.MakeScope.Var('domcom_power_trip_enslaved').GetValue|0]的[GetPlayer.MakeScope.Var('domcom_power_trip_eligible').GetValue|0]名合格居民被占领后停止了战役，然后完成了两次不可能的任务：#NGodsbane#!被部署，你被俘虏了。"
  domcom_power_trip_sated_modifier:0 "饱了"
  domcom_power_trip_sated_modifier_desc:0 "动力之旅已经消除了关心普通压力的需要。三年内压力增益减少 100%。"
  domcom_human_ai_godsbane_modifier:0 "神祸——凡人化"
