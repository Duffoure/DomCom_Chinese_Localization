  DOMCOM_UI_SORT_TOTAL:0 "总计"
  DOMCOM_UI_SORT_TOTAL_TT:0 "按六项技能的简单总和排序。"
  DOMCOM_UI_SORT_PRIZE:0 "战利品"
  DOMCOM_UI_SORT_PRIZE_TT:0 "按整体价值排序：技能、先天品质和个性。能力占一半，因为它与议会技能的等级不同。 深度 绿帽 经验 增加了一点。"
  DOMCOM_UI_REPAIR_COLLAPSES:0 "修复崩溃状态"
  DOMCOM_UI_REPAIR_COLLAPSES_TT:0 "重新开放那些彻底陷入困境被记录为已解决的受试者，同时保留他们的头衔。修复旧的终端状态，以便可以再次尝试折叠。"
  domcom_invite_to_bed_interaction_desc:0 "派人去找他们。我们之间已经了解的事情不必继续了解。"
  domcom_invite_to_bed_tt:0 "#weak 邀请他们来到你的床上。下一个事件会让你选择低调或大胆的方式。#!"
  domcom.800.t:0 "约定之时"
  domcom.800.desc:0 "他们在我召唤后前来。问题不在于是否发生，而在于这个家庭有多少人会理解自家屋檐下究竟发生了什么。"
  domcom.800.a:0 "低调一些。只属于我们。"
  domcom.800.a.tt:0 "#weak10% 暴露风险。如果没有人发现你，谨慎行事会增强你的阴谋和指挥力，同时增加一点恐惧。一个已经在你之下拥有 1000 XP 的混蛋不会对抗或监禁你们中的任何一个。#!"
  domcom.800.b:0 "公开到足以让仆人们议论。"
  domcom.800.b.tt:0 "#weak35% 暴露风险。成功更令人畏惧；发现可能会引发与他们配偶的直接对抗，除非那个混蛋在你手下已经达到 1000 XP。#!"
  domcom.800.c:0 "就在他们自己的大厅里，让他们自己得出结论。"
  domcom.800.c.tt:0 "#weak65% 暴露风险。如果你侥幸逃脱了惩罚，这将是最大胆的奖励，但如果他们的配偶逼迫你，你将面临最严厉的监禁风险。最终以 1000 绿帽 XP 提交，消除了对抗和监禁风险。#!"
  domcom.800.d:0 "今晚不行。"
  domcom.800.d.tt:0 "没有开始相遇就退出。#P不消耗冷却时间；邀请上床可以立即再次对该角色使用。#!"
  domcom_invite_to_bed_interaction:0 "邀请同床"
  domcom_alpha_recent_challenge_tt:0 "该角色在过去的一年内没有面对过您的阿尔法对抗"
  DOMCOM_UI_MAINTENANCE_TITLE:0 "维护"
  DOMCOM_UI_MAINTENANCE_DESC:0 "开发/恢复工具。重建保留存储的测量值；重骰会替换世界上的每一个成年男性测量值。"
  DOMCOM_UI_REBUILD_DISPLAY:0 "重建捐赠展示"
  DOMCOM_UI_REBUILD_DISPLAY_TT:0 "从存储的数据中刷新可见的捐赠和偏好信息。现有保存中缺失的偏好测量将在不重新滚动有效主体或偏好的情况下进行初始化。"
