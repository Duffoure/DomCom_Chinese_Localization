  domcom_intimacy_enforcer_modifier:0 "捍卫家庭"
  domcom_intimacy_enforcer_modifier_desc:0 "抓住并战胜一个厚颜无耻的入侵者，暂时增强了这个角色的武力自信、阴谋和威力。"
  DOMCOM_UI_PAGE_WORLD_CUCKS:0 "世界杯"
  DOMCOM_UI_WORLD_CUCKS_TITLE:0 "世界杯"
  DOMCOM_UI_WORLD_CUCKS_FLAVOR:0 "支配机制不止于我的宫廷。这些是被其他赞助人嘲笑的活生生的角色。此页面是面向玩家的无所不知的编年史：即使受害者、我的统治者或更广泛的世界不知道潜在的事件或出身，它也会显示原始的混蛋。"
