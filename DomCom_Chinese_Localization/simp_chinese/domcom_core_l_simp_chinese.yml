  domcom_rebuild_measurements_decision_desc:0 "#N具有破坏性。#!丢弃所有记录的长度和周长，然后从头开始重新滚动。每个角色的大小都会改变。在更改卷权重或 Carnalitas 播种图后使用此功能。"
