  DOMCOM_UI_BREAST_NOTE:0 "#weak胸部属性仅限成年人使用，一经指派即为永久。系统使用支配机制固定的美国/欧盟转换惯例，在存储的尺寸旁显示熟悉的文胸尺码。胸部精通是单独领悟的经验：分娩每生一个孩子增加15点经验，符合条件的亲密经验亦可改变它。“皇家文胸”选项可在英寸和厘米之间切换显示；公制显示四舍五入至最接近的0.5厘米，不会改变存储的实际身体数值。#!"
