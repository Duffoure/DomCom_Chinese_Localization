  domcom_endowment_micro_desc_imperial:0 "微小阴茎的长度不超过 2.5 英寸，围度不超过 3.5 英寸。"
  domcom_endowment_micro_desc_metric:0 "微小阴茎的长度不超过 6.35 厘米，围度不超过 8.89 厘米。"
  domcom_endowment_small_desc_imperial:0 "较小通常指长度为 2.6–4.2 英寸；围度超过 5.0 英寸则会提升为平均。"
