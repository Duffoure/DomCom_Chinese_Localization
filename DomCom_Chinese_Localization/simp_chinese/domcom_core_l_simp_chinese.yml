  domcom.801.t:0 "被发现——却未被阻止"
  domcom.801.desc:0 "这个家庭已经看到了足够多的事情，足以明白发生了什么。然而冲突到来时，我太危险、准备太充分，或者单纯难以被逼入绝境。丑闻仍然存在；但他们惩罚我的能力已经不复存在。"
  domcom.801.a:0 "让他们记住是谁全身而退。"
  domcom.802.t:0 "被抓住并逼入绝境"
  domcom.802.desc:0 "这一次，目击者只是开始。冲突对我不利，而这个家庭拥有足够的力量、勇气或计谋施加后果。在他们拥有法律权威的地方，双方任一人都可能遭到监禁。"
  domcom.802.a:0 "这次情况很糟。"
  domcom.803.t:0 "被发现——并获准继续"
  domcom.803.desc:0 "这个家庭已经看到了足够多的事情，足以完全明白发生了什么。但[scope:domcom_intimacy_partner.GetShortUINamePossessive]的配偶已经在我的支配下达到最终臣服。丑闻仍可能损害地位，但已经没有冲突可赢，也没有监禁可施加。"
  domcom.803.a:0 "他们已经知道自己的位置。"
  domcom.900.t:0 "重新滚动每项捐赠？"
  domcom.900.desc:0 "这将永久丢弃每个存储的控制机制长度和周长测量值以及每个存储的捐赠偏好，然后在世界各地生成新的。如果您只需要初始化或重新同步可见信息，请使用重建捐赠显示。"
  domcom.900.a:0 "是的。重新滚动一切。"
  domcom.900.a.tt:0 "#N每个现有的支配机制 禀赋测量和适用的偏好都会改变。#!"
  domcom.900.b:0 "取消."
  domcom_intimacy_discreet_modifier:0 "谨慎行事"
  domcom_intimacy_discreet_modifier_desc:0 "谨慎的秘密亲密关系增强了这个角色的阴谋和情境指挥能力。"
  domcom_intimacy_open_modifier:0 "经过算计的大胆"
  domcom_intimacy_open_modifier_desc:0 "摆脱公开的危险关系增强了这个角色的阴谋和军事信心。"
  domcom_intimacy_brazen_modifier:0 "肆无忌惮的崛起"
  domcom_intimacy_brazen_modifier_desc:0 "刻意挑衅的联络增强了这个角色的武功自信和武功。"
  domcom_intimacy_prevailed_modifier:0 "在对峙中获胜"
  domcom_intimacy_prevailed_modifier_desc:0 "即使被发现，这个角色仍赢得了冲突并全身而退。"
  domcom_intimacy_cornered_modifier:0 "因丑闻陷入绝境"
