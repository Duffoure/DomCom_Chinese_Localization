  domcom_tantalize_tt_header:0 "成功率：#V [scope:recipient.MakeScope.ScriptValue('domcom_tantalize_chance_v063_value')|0]%#!"
  domcom_tantalize_tt_success:0 "#P成功：他们会进一步受到你的影响并获得奉献。#!#N可能的成本：压力、怀孕/性交证据、嫉妒、意见丧失、竞争或现有关系受损。#!"
  domcom_tantalize_tt_failure:0 "#N失败：他们抵制你的影响，并在 2 年内失去对你 30 的好感。#!"
  rule_domcom_debug_tools:0 "控制机制：重建工具"
  rule_domcom_debug_tools_desc:0 "添加两个维护决策，用于修复或重新应用现有保存的控制机制数据。用于故障排除和测试。"
  domcom_debug_tools:0 "控制机制：重建工具"
