l_simp_chinese:
  game_rule_category_domcom:0 "圣社主权"
  domcom_alpha_check_interaction:0 "阿尔法对抗"
  domcom_alpha_check_interaction_desc:0 "向[recipient.GetShortUIName]发起全面的阿尔法对抗挑战。选择一个实际的比赛：CK3单挑比武、可用的棋牌对弈策略或计算的站立和杠杆检查。显示的阿尔法百分比仅适用于常备加杠杆航线；物理和棋盘游戏路线由他们的真实小游戏决定。失败的非物理路线可能会引发逆向阿尔法挑战，包括来自足够激进的对手的致命决斗。 阿尔法巴萨战仍然是快速的一键式替代方案。"
  domcom_alpha_check_success_toast:0 "阿尔法对抗 获胜"
  domcom_alpha_check_failure_toast:0 "对方仍拒绝屈服"
  domcom_tantalize_interaction:0 "挑逗"
  domcom_tantalize_interaction_desc:0 "测试[recipient.GetShortUINamePossessive]吸引力并将[recipient.GetHerHim]引诱进我的影响力之下。挑逗开启独立的奉献度轨道；情人与灵魂伴侣可以‘深化圣社’。在1000奉献度时，受试者会自动进入庇护者终极编号的‘绝对服从’状态。"
  domcom_tantalize_success_toast:0 "挑逗成功"
  domcom_tantalize_failure_toast:0 "挑逗遭拒"
  domcom_pet_created_toast:0 "绝对服从"
  domcom_entice_through_lover_interaction:0 "通过情人诱惑"
  domcom_entice_through_lover_interaction_desc:0 "当[recipient.GetShortUIName]已经对我的某位愿配合的情人或灵魂伴侣产生渴望时，以该情人作为中间人。如果情人是我的灵魂伴侣、对我极为喜爱、已被我所有、或已对我深具奉献度，则其会配合。吸引力仍指向该情人；成功会在不对[recipient.GetShortUINamePossessive]制造虚假性遭遇或改变其取向的情况下，对我产生主权/奉献度筹码。"
  domcom_entice_through_lover_success_tt:0 "[recipient.GetShortUIName]通过中间人情人被引诱进我的影响范围。"
  domcom_entice_through_lover_failure_tt:0 "[recipient.GetShortUIName]拒绝让接触我情人的机会成为筹码。"
  domcom_entice_through_lover_success_toast:0 "成功通过情人引诱"
  domcom_entice_through_lover_failure_toast:0 "诱饵被拒绝"
  domcom_deepen_communion_interaction:0 "深化圣社"
  domcom_deepen_communion_interaction_desc:0 "作为情人或灵魂伴侣，与[recipient.GetShortUIName]度过专属时光。选择一场实际的CK3棋牌对弈、一场非致命的切磋决斗、或是一个宁静的夜晚。活动结果、[recipient.GetShortUINamePossessive]性格以及灵魂伴侣状态将决定奉献度增长多少。"
  domcom_test_devotion_interaction:0 "考验奉献"
  domcom_test_devotion_interaction_desc:0 "要求[recipient.GetShortUIName]用具体事物证明深厚情谊：内宅情报、选择你而非已被戴绿帽子的配偶、或积极的谋划支持。可从600奉献度起使用。"
  domcom_claim_as_pet_interaction:0 "旧版宣告为宠奴"
  domcom_claim_as_pet_interaction_desc:0 "旧版兼容互动。当庇护者已知时，绝对服从现在会在1000奉献度时自动触发。"
  domcom_inspect_obedience_interaction:0 "查看奉献度"
  domcom_inspect_obedience_interaction_desc:0 "查看[recipient.GetShortUINamePossessive]关系进展。 \n \n 奉献度：#V[GuiScope.SetRoot(recipient.MakeScope).ScriptValue('domcom_obedience_display_value')|0]/ 1000#!\n \n 有兴趣 1+ · 受诱惑 200+ · 执着 400+ · 顺从 600+ · 忠诚 800+ · 绝对左侧 1000。"
  domcom_inspect_dominion_interaction:0 "查看主权度"
  domcom_inspect_dominion_interaction_desc:0 "回顾站在圣餐下的[recipient.GetShortUINamePossessive]。 \n \n 绿帽 经验：#V[GuiScope.SetRoot(recipient.MakeScope).ScriptValue('domcom_cuck_xp_display_value')|0]/ 1000#!\n \n 在 1000 时，对象达到彻底陷陷。"
  domcom_embarrass_through_relative_interaction:0 "羞辱其绿帽奴"
  domcom_embarrass_through_relative_interaction_desc:0 "利用我与[recipient.GetShortUIName]确立的关系，尝试公开羞辱其已被拥有的配偶或近亲。已被拥有的目标每四个月只能面临一次尝试，尝试可能会失败，且同一位庇护者最多成功羞辱同一目标六次。"
  domcom_embarrass_tt_success:0 "公开羞辱成功。"
  domcom_embarrass_tt_failure:0 "尝试失败，但仍会消耗四个月的尝试窗口。"
  domcom_embarrass_random_target_tt:0 "支配机制首先选择一位合格的拥有配偶或通过[recipient.GetShortUIName]链接的近亲。然后根据所选目标计算成功掷骰。目标选择 随机数 和分辨率掷骰是隐藏的，因此 CK3 不会将它们呈现为虚假选项百分比。"
  domcom_public_humiliation_toast:0 "一场公开羞辱"
  domcom_restore_protected_marriage_interaction:0 "恢复受保护婚姻"
  domcom_restore_protected_marriage_interaction_desc:0 "将这种受保护的债券恢复为婚姻。将此用于较旧的保存，其中关系在控制机制 2.6.56 可以记住其确切合法状态之前已被搁置。"
  domcom_restore_protected_concubine_interaction:0 "恢复受保护侧室"
  domcom_restore_protected_concubine_interaction_desc:0 "以妾/驸马身份恢复此保护债券。将此用于较旧的保存，其中关系在控制机制 2.6.56 可以记住其确切合法状态之前已被搁置。"
  DOMCOM_PROTECTED_BOND_MANUAL_MARRIAGE_TOAST:0 "受保护婚姻已恢复"
  DOMCOM_PROTECTED_BOND_MANUAL_CONCUBINE_TOAST:0 "受保护侧室已恢复"
  domcom_reveal_true_parentage_interaction:0 "揭露真实亲子关系"
  domcom_reveal_true_parentage_interaction_desc:0 "当 CK3 已经存储了不同的亲生父亲时，公开揭示[recipient.GetShortUINamePossessive]真正的亲生父亲。直系父母可以使用此功能，而无需先寻找秘密。 支配机制从不猜测或捏造出身；它公开了保存的现有真实父亲记录，并相应地更新了孩子公认的房子。"
  domcom_reveal_true_parentage_toast:0 "真实亲子关系已揭露"
  domcom_restore_concealed_identity_interaction:0 "恢复隐匿身份"
  domcom_restore_concealed_identity_interaction_desc:0 "从 CK3 已存储的生物身份数据中恢复[recipient.GetShortUINamePossessive]公共父亲和 家族。这可以在订婚或结婚后使用，并且不会改变现有的配偶、订婚或子女。如果保存中不包含拥有房屋的真正父亲，控制机制将不会发明一个。"
  domcom_restore_concealed_identity_toast:0 "隐匿身份已恢复"
  domcom_acknowledge_blood_interaction:0 "承认我的血脉"
  domcom_acknowledge_blood_interaction_desc:0 "公开承认[recipient.GetShortUIName]是我的，并将[recipient.GetHerHim]带入我的房子。如果[recipient.GetSheHe]之前是被拥有者的主要继承人，支配机制将保留为我的血要求退位的替代继承要求。公开曝光还可能会导致人工智能拒绝承认、监禁孩子，甚至在极少数情况下谋杀孩子。"
  domcom_acknowledge_blood_toast:0 "我的血脉已被承认"
  domcom_blood_heir_recorded_toast:0 "被取代的继承人已记录"
  domcom_blood_heir_repudiated_toast:0 "混蛋拒绝你的孩子"
  domcom_blood_heir_imprisoned_toast:0 "你的孩子被夺走"
  domcom_blood_heir_murdered_toast:0 "以血还血"
  domcom_blood_heir_repudiated_opinion:0 "被否认的继承人"
  domcom_blood_heir_persecuted_opinion:0 "承认后遭到迫害"
  domcom_cucked_modifier:0 "被戴绿帽子"
  domcom_cucked_modifier_desc:0 "这个角色的家族已被另一位统治者以性关系取代。公开的耻辱降低了总体好感和吸引力好感，并使勾引、浪漫和私奔计谋进展得更慢。"
  domcom_owned_modifier:0 "被占有"
  domcom_owned_modifier_desc:0 "该角色未通过阿尔法对抗并生活在支配机制下：#N-25% 外交#!和#N-25 吸引力意见#!。他们将每月正收入的 22% 支付给赞助人（家庭支配机制下为 30%）；处于彻底陷入困境的束缚尺支付 35%（家庭控制机制下为 43%）。他们还交出情报网络，并且极不愿意在政治或军事上抵抗他们的庇护者。"
  domcom_humiliated_stage_modifier:0 "蒙受羞辱"
  domcom_humiliated_stage_modifier_desc:0 "绿帽经验：低于250。羞辱是真实的，但抵抗仍然存在。"
  domcom_submissive_stage_modifier:0 "顺从"
  domcom_submissive_stage_modifier_desc:0 "卡克经验：250–499。阻力开始减弱。"
  domcom_broken_stage_modifier:0 "破碎"
  domcom_broken_stage_modifier_desc:0 "卡克经验：500–749。对象的社会信心正在崩溃。"
  domcom_abject_stage_modifier:0 "卑微"
  domcom_abject_stage_modifier_desc:0 "卡克经验：750–999。只剩下彻底陷入了。"
  domcom_royal_dominion_modifier:0 "皇家统治机制"
  domcom_royal_dominion_modifier_desc:0 "国王或皇帝受到羞辱是一项政治事实，而不仅仅是私人丑闻。他们的宫廷和封臣网络都暴露在支配者面前。"
  domcom_cucked_partner_opinion:0 "我的家族受到玷污"
  domcom_cucked_child_opinion:0 "我蒙受羞辱的活证据"
  domcom_owned_by_patron_opinion:0 "受支配机制约束"
  domcom_resisted_alpha_opinion:0 "试图占有我"
  domcom_public_humiliation_target_opinion:0 "当众羞辱我的领主"
  domcom_public_humiliation_patron_opinion:0 "支配性的存在"
  domcom_acknowledged_blood_opinion:0 "承认我的血脉"
  domcom.100.t:0 "彻底沦陷"
  domcom.100.desc:0 "[domcom_collapsing_subject.GetShortUIName]已经承受了圣社的全部压力。贡赋、丑闻、曝光与一次又一次的羞辱，终于让[domcom_collapsing_subject.GetHerHim]走到了抵抗的尽头。\n\n我可以剥夺一切，让[domcom_collapsing_subject.GetHerHim]保留[domcom_collapsing_subject.GetSheHe]为我效力所统治的土地，或者任由[domcom_collapsing_subject.GetHerHim]陷入绝望。"
  domcom.100.desc.male:0 "[domcom_collapsing_subject.GetShortUIName]已经承受了圣社的全部压力。贡赋、丑闻、曝光与一次又一次的羞辱，终于让他走到了抵抗的尽头。\n\n我可以夺走一切，让他臣服于我的统治，永久改变他的公开形象，或者任由他陷入绝望。"
  domcom.100.desc.noble_family:0 "[domcom_collapsing_subject.GetShortUIName]已经陷入彻底陷入困境，但[domcom_collapsing_subject.GetHerHis]世家的产权并不是普通的土地：它属于家族及其庄园。 \n \n 我可以让众议院本身提交。在我的政府可以接待贵族家庭的地方，它的东州和这个政治领域中合格的土地分支将被迫服从我。如果我的政府不能保留这样的家庭机构，其普通土地财产将被没收，特殊的家庭头衔也将被取消。"
  domcom.100.a.house:0 "让家族臣服"
  domcom.100.a.house.tt:0 "这就是贵族家族版本的夺取领土。家族头衔本身不能合法地成为您的家族头衔。如果你的政府支持贵族家族，[domcom_collapsing_subject.GetShortUIName]保留家族身份和庄园，但成为你的附庸统治者，同一政治领域中符合资格的[domcom_collapsing_subject.GetHerHis]家族的土地成员被迫在你之下，而后来的东州在你活着时继承了附庸关系。如果你的政府无法接待贵族家庭，他们的普通土地财产将被没收，特殊的家庭头衔也将被取消。"
  domcom.100.a:0 "夺走一切"
  domcom.100.a.tt:0 "#P扣押总额：#!普通世俗头衔和国库交给您。游牧者/蒙古包头衔和冒险家营地是被拆除的，而不是非法授予的。贵族家族统治者收到他们自己的#V让众议院提交#!结果。宗教领袖、礼仪官、部长官和其他 CK3 机构的无地办公室受到保护，不会被强行重新分配。"
  domcom.100.c:0 "让[domcom_collapsing_subject.GetHerHim|U]臣服"
  domcom.100.c.tt:0 "#P中间地带：#![domcom_collapsing_subject.GetShortUIName]保留当前的所有头衔或个人统治者身份，彻底陷陷被永久解决，支配机制继续存在。[domcom_collapsing_subject.GetSheHe|U]交出[domcom_collapsing_subject.GetHerHis]当前国库的一半，产生符合资格的声望，然后支付#V月正收入的#!35%#!作为贡品（根据家庭支配机制，#V43%#!）。"
  domcom.100.d:0 "使他女性化"
  domcom.100.d.tt:0 "#P公共重制：#![domcom_collapsing_subject.GetShortUIName]保留所有当前标题并在政治上保持不变，但彻底陷陷被永久解决为#V女性化#!。他获得了永久的公共特征和羞辱性的绰号，失去了合格的声望，遭受持续的社会/声望惩罚，变得极不可能抵抗他的赞助人，并且他的肖像被尽最大努力使用香草资产进行了干净的/女性化的呈现。他保留了正常的支配机制贡品结构，而不是成为束缚统治者。"
  domcom.100.b:0 "任[domcom_collapsing_subject.GetHerHim|U]陷入绝望"
  domcom.200.t:0 "被圣社吸引"
  domcom.200.desc:0 "[domcom_admirer.GetShortUIName]无法忽视[domcom_admirer.GetHerHis]家族发生的变化。\n\n最初的好奇如今已经变成了明确无误的邀请。\n\n[domcom_admirer.GetSheHe|U]邀请我共度一个私密的夜晚。"
  domcom.200.desc.kin:0 "[domcom_admirer.GetShortUIName]无法忽视[domcom_admirer.GetHerHis]家族发生的变化。这一切通过[domcom_crush_source.GetShortUIName]传到了他们那里，而[domcom_admirer.GetSheHe]一直在观察它所产生的影响。\n\n最初的好奇如今已经变成了明确无误的邀请。\n\n[domcom_admirer.GetSheHe|U]邀请我共度一个私密的夜晚。"
  domcom.200.a:0 "接受[domcom_admirer.GetHerHim]。"
  domcom.200.b:0 "不，这已经不再是了。"
  domcom_open_communion_decision:0 "打开圣社账簿"
  domcom_open_communion_decision_desc:0 "打开私人登记册，我通过它记录受到损害的家庭、那些受到支配机制控制的家庭、等待确认的鲜血，以及现在向我倾斜的更广泛的网络。"
  domcom_open_communion_decision_tooltip:0 "打开共融#!管理账本的#V支配机制。"
  domcom_open_communion_decision_confirm:0 "打开账簿"
  DOMCOM_UI_TITLE:0 "圣社主权"
  DOMCOM_UI_SUBTITLE:0 "追踪那些被你玷污、占有或与你血脉相连的人"
  DOMCOM_UI_CLOSE:0 "关闭"
  DOMCOM_UI_REFRESH:0 "刷新账簿"
  DOMCOM_UI_REFRESH_TT:0 "从当前保存安全地刷新控制机制，而无需进行容易崩溃的世界扫描。这会重新发现来自当前恋人/灵魂伴侣和儿童证据的个人被卡记录，将可恢复的 1000/1000 奉献修复为编号的奴隶身份，并清除显示缓存。每个名册在打开时都会延迟重建；使用审计控制机制记录进行完整的世界登记重建。"
  DOMCOM_UI_PAGE_OVERVIEW:0 "概览"
  DOMCOM_UI_PAGE_CUCKED:0 "被戴绿帽子"
  DOMCOM_UI_PAGE_OWNED:0 "已占有"
  DOMCOM_UI_PAGE_ENDOWMENTS:0 "身体资质"
  DOMCOM_UI_PAGE_LOVERS:0 "情人"
  DOMCOM_UI_PAGE_PROSPECTS:0 "潜在对象"
  DOMCOM_UI_PAGE_BLOOD:0 "血脉与子女"
  DOMCOM_UI_PAGE_SECRETS:0 "秘密与情报"
  DOMCOM_UI_PAGE_LEDGER:0 "账簿"
  DOMCOM_UI_SIDEBAR_NOTE:0 "仍可在角色肖像上右键使用互动。使用账簿查看哪些人与你有关，以及原因。"
  DOMCOM_UI_OVERVIEW_TITLE:0 "圣社"
  DOMCOM_UI_OVERVIEW_FLAVOR:0 "这是你的关系网络简表：你羞辱了谁、谁听命于你、谁的孩子属于你，以及哪些家族如今与你的势力相连。"
  DOMCOM_UI_OVERVIEW_ROSTER:0 "当前名册"
  DOMCOM_UI_OVERVIEW_COUNTS:0 "#V我的绿帽奴：#![GetPlayer.MakeScope.Var('domcom_ui_cucked_count').GetValue|0]   •   #V世界绿帽奴：#![GetPlayer.MakeScope.Var('domcom_ui_world_cuck_count').GetValue|0]\n#V受臣服者：#![GetPlayer.MakeScope.Var('domcom_ui_owned_count').GetValue|0]   (#V皇家受臣服者：#![GetPlayer.MakeScope.Var('domcom_ui_royal_owned_count').GetValue|0])   •   #V亲密纽带：#![GetPlayer.MakeScope.Var('domcom_ui_lovers_count').GetValue|0]\n#V内宅支配：#![GetPlayer.MakeScope.Var('domcom_ui_household_count').GetValue|0]   •   #V宗族前景：#![GetPlayer.MakeScope.Var('domcom_ui_prospect_count').GetValue|0]\n#V待确认血脉子女：#![GetPlayer.MakeScope.Var('domcom_ui_blood_count').GetValue|0]"
  DOMCOM_UI_OVERVIEW_RULE:0 "支配机制的措施"
  DOMCOM_UI_OVERVIEW_RULE_TEXT:0 "外遇只会让你踏入大门。#V阿尔法对抗#!通过权衡卡克的经验、等级、名声、恐惧、外交、阴谋、英勇、军事实力和气质来决定压力是否持续。羞辱打开了裂口；后来的压力决定房子是否折叠。"
  DOMCOM_UI_MODES_POWERS_TITLE:0 "模式和权力"
  DOMCOM_UI_MODES_POWERS_DESC:0 "将您的永久模式和权力保留在这里，而不是让“决策”选项卡变得混乱。"
  DOMCOM_UI_JOLLY_ENABLE:0 "启用 Jolly Rancher"
  DOMCOM_UI_JOLLY_DISABLE:0 "禁用 Jolly Rancher"
  DOMCOM_UI_JOLLY_TT:0 "为你的王朝切换快乐牧场主模式。当激活时，情人痘和大痘会从你和活着的王朝成员身上清除，并通过模式的维护周期再次清除。"
  DOMCOM_UI_HUMAN_AI_ENABLE:0 "成为人工智能中的人类"
  DOMCOM_UI_HUMAN_AI_DISABLE:0 "人工智能终结人类"
  DOMCOM_UI_HUMAN_AI_TT:0 "切换人类人工智能名望特征及其超自然包。该特征及其非性能力没有年龄门控的控制机制。"
  DOMCOM_UI_FREEZE_TIME:0 "冻结时间"
  DOMCOM_UI_FREEZE_TIME_TT:0 "获得 3 点时间冻结费用。心灵感应命令、传送到我的法庭和要求提交会消耗费用，而不是施加正常的反冲力。"
  DOMCOM_UI_APEX_INVITE:0 "邀请顶尖女性"
  DOMCOM_UI_APEX_INVITE_TT:0 "邀请外交范围内符合条件的顶尖女性。招聘本身没有支配年龄的机制门。只有具有生育能力的成年新兵才能进入繁殖队列；其他人都只是被招募的。一年冷却时间。"
