  DOMCOM_UI_BODY_REROLL_PAGE_OF:0 "第 [GetPlayer.MakeScope.Var('domcom_ui_body_reroll_page_display').GetValue|0] / [GetPlayer.MakeScope.Var('domcom_ui_body_reroll_pages_display').GetValue|0] 页"
