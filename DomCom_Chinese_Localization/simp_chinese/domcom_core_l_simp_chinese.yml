  DOMCOM_UI_LEDGER_TITLE:0 "总账"
  DOMCOM_UI_LEDGER_FLAVOR:0 "名册展示当前情况。本页面记录我扮演当前角色期间所做之事的规模。"
  DOMCOM_UI_LEDGER_ALPHA_TITLE:0 "阿尔法支票"
  DOMCOM_UI_LEDGER_ALPHA:0 "尝试：#V[GetPlayer.MakeScope.Var('domcom_alpha_attempts').GetValue|0]#!\n 成功统治：#P[GetPlayer.MakeScope.Var('domcom_alpha_successes').GetValue|0]#!\n 抵抗检查：#N[GetPlayer.MakeScope.Var('domcom_alpha_failures').GetValue|0]#!\n \n#V本季度剩余检查：#![GetPlayer.MakeScope.ScriptValue('domcom_alpha_budget_left_value')|0][GetPlayer.MakeScope.ScriptValue('domcom_alpha_budget_cap_value')|0]。阿尔法巴萨战并没有利用这一津贴。"
  DOMCOM_UI_LEDGER_COMMUNION_TITLE:0 "圣社"
  DOMCOM_UI_LEDGER_COMMUNION:0 "公开羞辱：#V[GetPlayer.MakeScope.Var('domcom_public_humiliations').GetValue|0]#!\n 承认的儿童：#V[GetPlayer.MakeScope.Var('domcom_blood_acknowledged').GetValue|0]#!\n 接受的潜在客户之夜：#V[GetPlayer.MakeScope.Var('domcom_admirer_nights').GetValue|0]#!\n 受到双重支配机制的家庭：#V[GetPlayer.MakeScope.Var('domcom_households_owned').GetValue|0]#!\n 支配机制传票已领取：#V[GetPlayer.MakeScope.Var('domcom_summons_claimed').GetValue|0]#!\n 为我的血统保证退位：#V[GetPlayer.MakeScope.Var('domcom_abdications_for_blood').GetValue|0]#!\n 最终崩溃解决：#V[GetPlayer.MakeScope.Var('domcom_collapses_resolved').GetValue|0]#!\n 提供贡品的家庭：#V[GetPlayer.MakeScope.Var('domcom_tribute_household_count').GetValue|0]#!\n 拒绝进贡：#N[GetPlayer.MakeScope.Var('domcom_tribute_refusal_count').GetValue|0]#!"
  DOMCOM_UI_LEDGER_NOTE:0 "这个账本记录的是持久的计数器，而不是逐行的编年史。右键单击交互和 GUI 操作提供相同的总数。"
  domcom_household_dominion_modifier:0 "家庭支配机制"
  domcom_household_dominion_modifier_desc:0 "这桩婚姻中的双方都对同一个赞助人负责。他们的家庭作为一个整体受到了损害：应用了额外的 绿帽 经验，每个拥有的配偶支付 30% 的正月收入，而不是 22%。"
  domcom_household_dominion_toast:0 "整个家庭都已屈服"
  domcom_summons_toast:0 "私人召见已完成"
  domcom_demand_abdication_for_blood_interaction:0 "为我的血脉要求退位"
  domcom_demand_abdication_for_blood_interaction_desc:0 "要求[recipient.GetShortUIName]将[recipient.GetHerHis]头衔交给公认的儿童控制机制记录，作为[recipient.GetHerHis]血统继承人。如果确认使该孩子脱离普通继承，则需求仍然存在。非常年轻的继任者更难强加；卡克经验和家庭支配机制使投降的可能性更大，而拒绝承认或监禁孩子则使投降变得更加困难。"
  domcom_abdication_success_toast:0 "我的血脉登上王座"
  domcom_abdication_failure_toast:0 "他们仍紧抓王座不放"
  DOMCOM_COLLAPSE_TITLE_TRANSFER_REASON_TOAST:0 "彻底陷入：领域投降"
  DOMCOM_NOBLE_COLLAPSE_TRANSFER_REASON_TOAST:0 "彻底陷陷：世家屈服"
  domcom.310.t:0 "承认我所有的血脉"
  domcom.310.desc:0 "账簿上有几个活着的孩子，他们的血迹是我的，但他们的家族仍然另有说法。我可以立刻承认他们所有人。这可能会立即改变多个领域的继承、联盟、婚姻计划和继承。 \n \n 如果一个人是被拥有者的继承人，支配机制会记录在改变血统之前取代继承权的情况——但公开曝光可能会招致混蛋的报复。"
  domcom.310.a:0 "承认所有符合条件的子女。"
  domcom.310.b:0 "还没有。"
  domcom.320.t:0 "选择工具"
  domcom.320.desc:0 "[domcom_gui_humiliated_cuck.GetShortUIName]已经在我的控制机制之下。 \n \n 羞辱可以通过足够亲密的人公开，以使侮辱毫无疑问。"
  domcom.320.desc.feminized:0 "[domcom_gui_humiliated_cuck.GetShortUIName]已在我的支配机制下公开重制。法庭知道我强加的陈述；现在，我可以通过一个足够亲近的人再次让这种地位刺痛，使这种侮辱毫无疑问。"
  domcom.320.a:0 "使用符合条件的配偶。"
  domcom.320.b:0 "使用符合条件的亲属。"
  domcom.320.c:0 "现在不要。"
  domcom.400.t:0 "战前臣服"
  domcom.400.desc:0 "[domcom_war_subject.GetShortUIName]已与[domcom_war_subject.GetSheHe]已臣服的赞助人展开公开战争。在浪费血液之前，[domcom_war_subject.GetSheHe]提供了条款。 \n \n 我可以要求投降，接受不流血的和平，或者坚持正常进行战争。"
  domcom.400.desc.feminized:0 "[domcom_war_subject.GetShortUIName]在彻底陷入陷点时被公开重制，并且在我的容忍度下仍然位于[domcom_war_subject.GetHerHis]领域。然而现在[domcom_war_subject.GetSheHe]正与我作战。在流血之前，旧的服从已经表明了自己的立场，并提出了条件。"
  domcom.400.a:0 "那么就投降。"
  domcom.400.a.tt:0 "如果我是防守方，他们投降的任何额外控制机制价格均遵循#V控制机制：投降#!游戏规则。如果我是攻击者，战争的正常胜利条件仍然是奖励。"
  domcom.400.b:0 "白色和平即可。"
  domcom.400.c:0 "不，让军队来决定吧。"
  setting_domcom_ai_off:0 "仅限玩家"
  setting_domcom_ai_off_desc:0 "AI统治者不会启动支配机制。现有的人工智能主体仍然服从已经建立在其之上的支配机制。"
  setting_domcom_ai_notable:0 "著名统治者"
  setting_domcom_ai_notable_desc:0 "默认。个性强烈的AI国王、皇帝和统治者可能会追求支配机制。这限制了后台处理，同时允许系统存在于玩家之外。"
  setting_domcom_ai_all:0 "所有符合条件的统治者"
  setting_domcom_ai_all_desc:0 "任何符合条件的成年人工智能统治者都可以寻求支配机制。这会创建一个更加活跃的世界，并可能会增加模拟工作。"
  DOMCOM_UI_PAGE_HELP:0 "使用方法"
  DOMCOM_UI_EMBARRASS:0 "使其难堪"
  DOMCOM_UI_EMBARRASS_TT:0 "试图通过已经是我的暗恋对象、情人或灵魂伴侣的合格成年配偶或亲戚来公开羞辱。每个拥有者每年最多可以面临三次尝试，尝试可能会失败，并且同一个赞助人最多可以成功使该对象难堪六次。"
  DOMCOM_UI_ABDICATE:0 "退位"
  DOMCOM_UI_ABDICATE_TT:0 "当这个拥有的统治者在我的家族中有一个有效的公认的血统继承人时可用。 即使 CK3 随后将孩子从普通继承中删除，支配机制也会在确认之前立即保留其主要继承人的孩子。 绿帽 XP、家族支配机制、继承人的年龄、否认和监禁都会影响接受度。"
  DOMCOM_UI_ACKNOWLEDGE_ALL:0 "全部承认"
  DOMCOM_UI_ACKNOWLEDGE_ALL_TT:0 "打开确认事件，一次性将所有当前符合条件的圣社之子女纳入我的家族。"
  DOMCOM_UI_HELP_TITLE:0 "支配机制如何运作"
  DOMCOM_UI_HELP_QUICK:0 "#V公认的卡克：#!一位活着的统治者或配偶，有持续的证据表明另一个男人与他们现在的配偶上床或生下了他们配偶的孩子。公众受害者被昵称为#N被戴的#!。 \n \n#V阿尔法车轮战：#!可从 被戴绿帽 页面获取。 \n#V嘲讽：#!在控制机制之前右键单击被卡住的目标。 \n#V皇冠联盟：#!可用于绝对服从中的在位女王或女皇。 \n#V血统：#!承认在世的孩子被记录为您的孩子，但在您的房子之外。 \n#V情报：#!拥有的臣民为圣餐提供影响力。 \n#V天赋：#!吸引力和挑逗使用天赋偏好； 阿尔法没有。"
  DOMCOM_UI_HELP_FLOW_TITLE:0 "从外遇到支配机制"
  DOMCOM_UI_HELP_FLOW:0 "1.阿尔法是竞争，而不是诱惑。范围内的同性成年对手可能会受到挑战。等级、声望、恐惧、外交、阴谋、英勇、军事实力、个性和现有的 绿帽 XP 都很重要；吸引力和禀赋则不然。 \n \n 2.挑逗是吸引力轨道。相互导向允许这样做，而兼容性——包括相关的捐赠——会影响成功和奉献度增益。 \n \n 3. 证据很重要。实际的性证据或流离失所的亲子关系会造成被扣状态。战胜阿尔法，对抗被卡住的目标，建立完整的控制机制；没有证据的胜利反而创造了统治地位。 \n \n 4. 逆阿尔法是可能的。地位较低的人物仍然可以战胜地位较高的人物。 \n \n 5. 家庭吸引力会受到检查，而不是自动的。"
  DOMCOM_UI_HELP_SPECIAL_TITLE:0 "特殊规则"
  DOMCOM_UI_HELP_SPECIAL:0 "#V儿童识别：#!控制机制只能使用儿童CK3 静止记录。 \n \n#V禀赋持久性：#!活着的成年男性会保留其测量资料，除非您故意重新滚动它。 \n \n#V性能：#!账本使用惰性注册和分页列表。 \n \n#V忠诚度状态：#!舔舐臣服有自己的忠诚度轨迹，并在 100 XP 后永久具有政治约束力。 \n \n#VAI 控制机制：#!AI 统治者使用相同的核心系统，并通过周期性脉冲来提高性能。所有 模组 创作的性/浪漫参与对象均为 18 岁以上。"
  domcom_summon_imperial_tribute_decision:0 "召集宫廷缴纳贡赋"
  domcom_summon_imperial_tribute_decision_desc:0 "将我以下的统治者召集到法庭，并要求每个人选择如何承认他们之上的命令。可以提供黄金、士兵、声望、王朝访问权或家庭本身；拒绝会被记住。"
  domcom_summon_imperial_tribute_decision_tooltip:0 "开始帝国贡赋季。直属有地封臣将在未来数月内逐一被召见。"
  domcom_summon_imperial_tribute_decision_confirm:0 "打开贡院"
  domcom_imperial_gold_tribute_modifier:0 "帝国黄金贡品"
  domcom_imperial_gold_tribute_modifier_desc:0 "这位统治者已接受向霸主增加税收义务，为期五年。"
  domcom_imperial_military_tribute_modifier:0 "帝国军事贡赋"
  domcom_imperial_military_tribute_modifier_desc:0 "这位统治者已接受向霸主增加征召兵义务，为期五年。"
  domcom_imperial_favor_modifier:0 "帝国恩宠"
  domcom_imperial_favor_modifier_desc:0 "朝廷的顺从让这位统治者得到了霸主的青睐。"
  domcom_imperial_defiant_modifier:0 "抗命于王座之前"
  domcom_imperial_defiant_modifier_desc:0 "这位统治者公开拒绝朝贡，并承担了反抗的政治代价。"
  domcom.510.t:0 "王座前的贡赋"
  domcom.510.desc:0 "[domcom_tribute_patron.GetShortUIName]开启了贡赋季，并召我来到宫廷。我被要求公开展示自己在王座之下所处的位置。\n\n臣服的形式由我选择——完全拒绝则会带来相应的危险。"
  domcom.510.a:0 "我会缴纳更多税款。"
  domcom.510.b:0 "让我的威望装点王座。"
  domcom.510.c:0 "我的士兵会更加积极地响应。"
  domcom.510.d:0 "我的王朝及其秘密都向宫廷开放。"
  domcom.510.e:0 "我将我的家庭献给君主的恩宠。"
  domcom.510.f:0 "我不欠这样的贡赋。"
  domcom.520.t:0 "提供家庭"
  domcom.520.desc:0 "[domcom_tribute_vassal.GetShortUIName]选择了最亲密的提交形式。[domcom_household_offering.GetShortUIName]自愿进入我的私人公司，将公开的等级仪式变成了更加个人化的事情。 \n \n 任何因献祭而受到损害的婚姻现在都会直接进入控制机制。"
  domcom.520.a:0 "宫廷会记住这一点。"
  domcom.530.t:0 "贡赋季结束"
  domcom.530.desc:0 "最后一名请愿者已经来去。\n\n如今宫廷已经记录下谁缴了钱、谁提供了服务、谁开放了自己的王朝、谁献出了自己的家庭，以及谁有足够的自尊选择拒绝。"
  domcom.530.a:0 "将其记入账簿。"
  DOMCOM_UI_PAGE_IMPERIAL:0 "舔舐顶端"
  DOMCOM_UI_IMPERIAL_TITLE:0 "舔舐顶端"
  DOMCOM_UI_IMPERIAL_FLAVOR:0 "召集我直属领地中的成年成员，进行一场刻意羞辱性的忠诚测试。每一名符合条件的宫廷成员、直属封臣以及这些封臣宫廷中的成年成员都会单独作答。"
  DOMCOM_UI_IMPERIAL_STATUS:0 "#V上次测试合格：#![GetPlayer.MakeScope.Var('domcom_lick_total_count').GetValue|0]#P已满足：#![GetPlayer.MakeScope.Var('domcom_lick_complied_count').GetValue|0]#N已拒绝：#![GetPlayer.MakeScope.Var('domcom_lick_refused_count').GetValue|0]"
  DOMCOM_UI_IMPERIAL_FORMS_TITLE:0 "测试对象"
  DOMCOM_UI_IMPERIAL_FORMS:0 "我的宫廷中的成年成员、成年直属封臣，以及这些封臣宫廷中的成年成员。测试会直接在脚本中结算；只有查看本页面时才会重建结果名册。"
  DOMCOM_UI_SUMMON_TRIBUTE:0 "召集忠诚测试"
  DOMCOM_UI_SUMMON_TRIBUTE_TT:0 "立即进行“舔舐顶端”。每名符合条件的成年人都会独立接受测试。忠诚测试冷却期间无法使用此操作。"
  DOMCOM_UI_IMPERIAL_NOTE:0 "#weak “舔舐顶端”会记录个人的服从与拒绝，只有在本页面打开时才会加载其肖像名册。#!"
  domcom_imperial_gold_tribute_opinion:0 "被勒索帝国贡赋"
  domcom_imperial_military_tribute_opinion:0 "沉重的军事贡赋"
  domcom_imperial_prestige_tribute_opinion:0 "受王座尊荣"
  domcom_imperial_dynastic_tribute_opinion:0 "王朝获宫廷恩宠"
  domcom_imperial_household_tribute_opinion:0 "家族献上王位"
  domcom_imperial_refusal_opinion:0 "要求帝国贡赋"
  DOMCOM_UI_SORT_LABEL:0 "排序："
  DOMCOM_UI_SHOW_LABEL:0 "显示："
