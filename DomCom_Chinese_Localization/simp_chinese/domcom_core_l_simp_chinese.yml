  domcom.910.t:0 "一份关注名单"
  domcom.910.desc:0 "现在通过不间断的控制脉冲和动态前景页面来处理前景。"
  domcom.910.a:0 "将他们记入账簿。"
  domcom_dominion_pulse_toast:0 "控制脉冲：#P[ROOT.Char.MakeScope.Var('domcom_featured_digest_pending').GetValue|0]#!前景警报和#V[ROOT.Char.MakeScope.Var('domcom_collapse_digest_pending').GetValue|0]#!彻底陷陷已准备就绪。当您想要采取行动时，请打开圣餐分类帐。"
  domcom_dominion_pulse_toast_title:0 "控制脉冲"
  domcom_dominion_pulse_prospects_line:0 "#P [ROOT.Char.MakeScope.Var('domcom_featured_digest_pending').GetValue|0]#! 条战略潜在对象警报已准备就绪。"
  domcom_dominion_pulse_collapses_line:0 "#V[ROOT.Char.MakeScope.Var('domcom_collapse_digest_pending').GetValue|0]#!彻底陷陷准备就绪。"
  domcom_dominion_pulse_ledger_line:0 "想要采取行动时打开圣社账簿。"
  domcom_demand_abdication_tt_success:0 "他们退位以支持您记录的血统继承人。继承者的年龄、待遇以及对象的服从都会影响这个机会。"
  domcom_demand_abdication_tt_failure:0 "他们拒绝了，并因抵抗你而额外获得 100 绿帽 XP。更年轻、被抛弃或被监禁的继任者更有可能遭到拒绝。"
