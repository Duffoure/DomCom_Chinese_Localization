  DOMCOM_UI_ROW_XP:0 "经验 [Character.MakeScope.Var('domcom_cuck_xp').GetValue|0] / 1000"
  DOMCOM_UI_ROW_CUCK_XP:0 "绿帽奴 XP [Character.MakeScope.Var('domcom_cuck_xp').GetValue|0] / 1000"
  DOMCOM_UI_ROW_ALPHA_CHANCE:0 "阿尔法 [Character.MakeScope.Var('domcom_ui_alpha_chance').GetValue|0]%"
  DOMCOM_UI_ROW_TRIBUTE_COMPACT:0 "@黄金图标！每月[GuiScope.SetRoot(Character.MakeScope).ScriptValue('domcom_monthly_tribute_value')|2]• 预付年份[GuiScope.SetRoot(Character.MakeScope).ScriptValue('domcom_annual_tribute_due_value')|0]"
  DOMCOM_UI_ROW_TRIBUTE_MONTHLY:0 "@黄金图标！每月自动贡品：[GuiScope.SetRoot(Character.MakeScope).ScriptValue('domcom_monthly_tribute_value')|2]"
  DOMCOM_UI_ROW_TRIBUTE_ANNUAL:0 "@黄金图标！可选的预付年份：[GuiScope.SetRoot(Character.MakeScope).ScriptValue('domcom_annual_tribute_due_value')|0]"
  DOMCOM_UI_EXTRACT_SECRETS:0 "提取秘密"
  DOMCOM_UI_EXTRACT_SECRETS_TT:0 "揭示该所属主体的控制机制情报网络中当前可触及的每一​​个秘密。#bold这揭示了秘密；它不会自动创建钩子。#!对您了解其秘密的角色使用勒索，将符合 CK3 正常规则的杠杆作用转化为钩子。"
  DOMCOM_UI_DEMAND_TRIBUTE_NOW:0 "收取一年预缴贡赋"
  DOMCOM_UI_DEMAND_TRIBUTE_NOW_TT:0 "立即要求臣民按照当前 22% 的税率（家庭支配机制下为 30%）缴纳一年的贡赋。他们自己的国库首先支付。任何短缺都由富有的成年封臣、朝臣和近亲夺取，他们会严重怨恨让他们付出代价的主题。每月的贡品被视为预付一年。"
  DOMCOM_UI_TRIBUTE_ADVANCE_TOAST:0 "已收取一年的贡赋"
  DOMCOM_UI_ALPHA_GAUNTLET:0 "奔跑阿尔法巴萨战"
  DOMCOM_UI_ALPHA_GAUNTLET_TT:0 "需要至少四名符合条件的 被戴绿帽 对手。挑战从最难的目标开始。第一次检查比普通的阿尔法对抗难度高 10%，每一次成功都会让剩下的跑步难度再增加 3%。每个目标都会获得与手动挑战相同的一年阿尔法冷却时间。第一次失败就结束了挑战；完善清晰的拨款支配机制五年未受挑战。"
  DOMCOM_UI_WORLD_ALPHA_GAUNTLET:0 "举办世界阿尔法大赛"
  DOMCOM_UI_WORLD_ALPHA_GAUNTLET_TT:0 "由负责世界杯记录的#V独特的在世成年赞助人#!打造单种子淘汰赛。目前#N被戴上#!、#N无行为能力#!、被监禁、死亡或未成年的赞助人不符合资格。 \n \n 每个参赛者都会收到一个#V阿尔法评级#!，来自外交、阴谋、英勇、武术能力、等级、声望、恐惧、军事实力、个性以及他们实际的混蛋组合的递减奖金。相同的评分驱动比赛赔率：没有隐藏的第二场比赛公式，并且玩家没有收到特殊系数。 \n \n 每轮将#V最强的剩余种子与最弱的#!配对，第二强与第二弱的种子配对，依此类推。胜利者独自前进；奇怪的领域给我们再见。这会删除受保护的弱括号。比赛赔率上限为#V95/5#!，因此真正的爆冷仍然有可能发生，但属于例外情况。幸存到最后八分之一即可获得#V挑战资格赛#!名次，略低于前 10%；前 10%、前 5%、前 1%、亚军和冠军的实力不断增强。 \n \n 结果报告记录您的阿尔法评分、冠军评分、淘汰者评分以及结束比赛的确切获胜机会。每年可以举办一场比赛。"
  DOMCOM_UI_WORLD_GAUNTLET_SUCCESS_TOAST:0 "世界阿尔法大赛结束"
  DOMCOM_UI_WORLD_GAUNTLET_FAIL_TOAST:0 "世界阿尔法大赛结束"
  domcom_world_gauntlet_tier_1_modifier:0 "世界试炼场——第 I 级"
  domcom_world_gauntlet_tier_1_modifier_desc:0 "一次成功的阿尔法全球战将授予#P+35%骑士效能#!，持续五年。它不与更高级别的世界挑战叠加。"
  domcom_world_gauntlet_tier_2_modifier:0 "世界试炼场——第 II 级"
  domcom_world_gauntlet_tier_2_modifier_desc:0 "强大的阿尔法穆斯林世界战授予#P+50%骑士效能#!，持续五年。它取代了 I/III 级世界挑战军事修正。"
  domcom_world_gauntlet_tier_3_modifier:0 "世界试炼场——第 III 级"
  domcom_world_gauntlet_tier_3_modifier_desc:0 "压倒性的阿尔法全球战授予#P+70%骑士效能#!，持续五年。它取代了较低的世界挑战军事修正。"
  DOMCOM_UI_GAUNTLET_PERFECT_TOAST:0 "主权无可撼动"
  DOMCOM_UI_GAUNTLET_PARTIAL_TOAST:0 "试炼场：[ROOT.Char.MakeScope.Var('domcom_gauntlet_cleared').GetValue|0] 人屈服，[ROOT.Char.MakeScope.Var('domcom_gauntlet_refused').GetValue|0] 人坚持到底"
  DOMCOM_UI_GAUNTLET_ROUTED_TOAST:0 "车轮战：无一人退缩"
  DOMCOM_UI_GAUNTLET_FAILED_TOAST:0 "阿尔法巴萨战事已破裂"
  domcom_dominion_unchallenged_modifier:0 "主权无可撼动"
  domcom_dominion_unchallenged_modifier_desc:0 "阿尔法二氧化硅战中的每一次合格挑战都没有失败。五年内，这会提供+100吸引力意见、+5外交、+5阴谋、+15%每月声望、+35初始个人计划成功机会、每阶段+10成功成长，以及+20%勾引、浪漫、私奔、交友和摇摆的速度。"
  domcom_forced_to_cover_tribute_opinion:0 "被迫替我支付朝贡"
  domcom_final_submission_modifier:0 "终极臣服"
  domcom_final_submission_modifier_desc:0 "该角色已达到终端控制机制状态。 彻底陷入已经解决了，不会再为他们开火了。"
  domcom_bound_ruler_modifier:0 "受缚统治者"
  domcom_bound_ruler_modifier_desc:0 "在彻底沦陷时免于被剥夺领地，此统治者现已受到束缚。"
  domcom_absolute_devotion_modifier:0 "绝对奉献"
  domcom_absolute_devotion_modifier_desc:0 "该角色对庇护者怀有绝对的奉献。"
  domcom_household_final_modifier:0 "家庭已屈服"
  domcom_household_final_modifier_desc:0 "夫妻双方都在同一赞助人的领导下最终服从，他们的家庭支配机制作为一个家庭得到解决。"
  domcom_dominated_modifier:0 "被彻底压制"
  domcom_dominated_modifier_desc:0 "这个角色失去了阿尔法的对抗。胜利者在他们的家庭周围建立了影响力和访问权，但这不是奉献、被卡住的状态或完整的控制机制。"
  domcom_reverse_alpha_victory_modifier:0 "逆转阿尔法"
  domcom_reverse_alpha_victory_modifier_desc:0 "击败地位高于我的人已经成为一种名声。十年内，个人计谋获得 +10 初始成功率，且勾引、浪漫、私奔、交友和拉拢计谋进展速度提高 10%。"
  domcom_reverse_alpha_major_upset_modifier:0 "逆转阿尔法——重大逆袭"
  domcom_reverse_alpha_major_upset_modifier_desc:0 "我扭转了巨大的地位差距。这会与“逆转阿尔法”叠加，额外提供 +10 初始个人计谋成功率，并使每阶段成功率增长 +5。"
  domcom_reverse_alpha_legendary_upset_modifier:0 "逆转阿尔法——传奇逆袭"
  domcom_reverse_alpha_legendary_upset_modifier_desc:0 "我克服了社会地位上的巨大鸿沟。这与其他反向阿尔法奖励叠加，增加+15初始个人计划成功机会，每阶段+5成功增长，缩短个人计划阶段，并授予+25吸引力好感。"
  domcom_endowment_modest_modifier:0 "适度的捐赠"
  domcom_endowment_modest_modifier_desc:0 "此人的随机生成生殖器尺寸属于普通偏小档次。精确测量值是持久保存的隐藏数据，仅在性吸引机制需要时使用。"
  domcom_endowment_average_modifier:0 "平均禀赋"
  domcom_endowment_average_modifier_desc:0 "此人的随机生成生殖器尺寸属于平均档次。"
  domcom_endowment_noteworthy_modifier:0 "值得关注的捐赠"
  domcom_endowment_noteworthy_modifier_desc:0 "此人的随机生成生殖器尺寸值得注意。尺寸并非人人偏好；是否合拍取决于另一角色隐藏的偏好。"
  domcom_endowment_enviable_modifier:0 "令人羡慕的天赋"
  domcom_endowment_enviable_modifier_desc:0 "此人随机生成的天赋异常大，可能会强烈影响与其偏好相匹配的角色的吸引力或挑逗。"
  domcom_endowment_legendary_modifier:0 "传奇天赋"
  domcom_endowment_legendary_modifier_desc:0 "这是统计上的极端离群值。只有当角色的私下偏好确实倾向于这种尺寸时，它才可能成为重大优势。"
  domcom_dominated_by_opinion:0 "压倒了我"
  domcom_final_devotion_opinion:0 "绝对的奉献"
  domcom_bound_ruler_opinion:0 "允许我保留领地"
  domcom_reverse_alpha_shock_opinion:0 "颠覆了等级秩序"
  domcom.101.t:0 "绝对的奉献"
  domcom.101.desc:0 "[domcom_collapsing_subject.GetShortUIName]已经超越了普通抵抗的范围。因为[domcom_collapsing_subject.GetSheHe]已经身处我自己的亲密家庭之中，已经没有什么东西值得仅为取乐而摧毁或夺走。\n\n最终状态是忠诚：永久、稳定，并且永不重复。"
  domcom.101.a:0 "那就这样定下吧。"
  domcom.105.t:0 "家庭屈服"
  domcom.105.desc:0 "[domcom_collapsing_subject.GetShortUIName]和[domcom_collapsing_spouse.GetShortUIName]在同一支配机制下均已到达阻力终点。 \n \n 他们的家庭不再需要两次单独的倒塌。它作为一个整体产生。"
  domcom.105.a:0 "这个家庭由我支配。"
  DOMCOM_UI_050_NOTE:0 "#V阿尔法/挑逗分裂：#!阿尔法检查是同性竞争对手的统治竞赛； 挑逗处理性吸引力和奉献度。现在，禀赋偏好影响的是性影响力，而不是阿尔法的主导地位。阿尔法前的胜利创造了没有奉献的机会； 绿帽 后的胜利增强了 绿帽 的经验。"
  DOMCOM_UI_SORT_MASTERY:0 "技巧"
  DOMCOM_UI_SORT_MASTERY_TT:0 "按学习的天赋精通 XP 从 0 到 32 排序。精通本身永远不会改变物理大小。"
  domcom_accepts_communion_modifier:0 "臣服于圣社"
  domcom_accepts_communion_modifier_desc:0 "支配机制解决了排他性问题。守护神可以维持其他恋人、灵魂伴侣、配偶、妾和浪漫关系，但该角色不会将这些关系视为背叛。如果一般的关系事件扰乱了已建立的支配机制情人关系，它们会定期重新建立。"
  domcom_communion_acceptance_opinion:0 "接受我的圣餐"
  DOMCOM_UI_ENFORCE_DOMINION:0 "执行支配机制"
  DOMCOM_UI_ENFORCE_DOMINION_TT:0 "立即修复并重新声明我的圣餐状态。这刷新了拥有主体的容忍度，回填了控制机制建立的恋人/灵魂伴侣，如果一般关系事件消除了联系，则恢复已注册的亲密控制机制，并重新应用针对一般不忠对抗的保护。它不会将未曾接触过的潜在客户变成情人。"
  DOMCOM_UI_ENFORCE_DOMINION_INLINE:0 "支配机制通常会自我维持。如果情人/灵魂伴侣状态需要修复，或者您想立即在现有保存中重新启用控制机制，请使用此选项。"
  DOMCOM_UI_ENFORCE_DOMINION_TOAST:0 "支配机制已被重申"
  nick_domcom_the_cucked:0 "被戴绿帽子的人"
  domcom_spawn_of_cuck_modifier:0 "鸭子的后代"
  domcom_spawn_of_cuck_modifier_desc:0 "父母在公共场合戴绿帽子的污点源于他们实际的生物学问题。此修正值仅适用于当 被戴绿帽 角色真正是亲生父母并给予 -2 外交、军事、管理、阴谋、学习和英勇时。"
  domcom_cuck_duel_defeat_modifier:0 "挑衅后落败"
  domcom_cuck_duel_defeat_modifier_desc:0 "在因戴绿帽子而受到嘲笑后，该角色接受了挑战，但在恢复荣誉之前就输了。"
  domcom_cuck_duel_refusal_modifier:0 "不会捍卫自己的荣誉"
  domcom_cuck_duel_refusal_modifier_desc:0 "这个角色吞下了公开的嘲讽，而不是挑战给他们戴绿帽子的人。"
  domcom_cuck_duel_honor_modifier:0 "捍卫荣誉"
  domcom_cuck_duel_honor_modifier_desc:0 "无论是否戴绿帽子，这个角色都回应了嘲讽并击败了挑战者。"
  domcom_taunt_cuck_interaction:0 "嘲讽 绿帽"
  domcom_taunt_cuck_interaction_desc:0 "嘲笑这个角色，因为这件事让他们被骗了。他们可能会公开让步，或者挑战我捍卫他们的荣誉。赢得对抗会让他们的 绿帽 经验 急剧上升；失败让他们恢复了一些地位。"
  domcom.600.t:0 "那么，捍卫你的荣誉吧"
  domcom.600.desc:0 "[domcom_taunt_patron.GetShortUIName|U]毫不掩饰这番侮辱。\n\n我的家庭中发生的一切被当作公开笑柄反过来嘲弄我，而每一句话都在要求同一个回答：要么我忍受，要么让[domcom_taunt_patron.GetHerHim]为此付出代价。"
  domcom.600.a:0 "那就面对我。"
  domcom_taunt_patron_win_tt:0 "你的赞助人赢得了非致命对抗。"
  domcom_taunt_victim_win_tt:0 "你赢得了这场非致命对抗，并挽回了一些地位。"
  domcom.600.b:0 "我不会让这场闹剧继续下去。"
  domcom.601.t:0 "嘲讽化为现实"
  domcom.601.desc:0 "挑战在侮辱开始时就结束了：按照我的条件。 \n \n 我的戴帽对手试图用武力回应羞辱，但失败了。曾经可能保密的事情现在更难以否认。"
  domcom.601.a:0 "这应该解决问题了。"
  domcom.602.t:0 "代价高昂的嘲讽"
  domcom.602.desc:0 "嘲笑很容易，直到被嘲笑的人成功回答为止。 \n \n 我的对手接受了挑战并获胜。他们的家庭耻辱仍然存在，但今天他们以我为代价恢复了一定程度的荣誉。"
  domcom.602.a:0 "享受这一刻吧。"
  domcom.603.t:0 "无应答"
  domcom.603.desc:0 "这种侮辱被听到、被理解，但没有得到回应。 \n \n 我的对手没有冒险捍卫自己的荣誉，而是接受了笑声并放弃了挑战。"
  domcom.603.a:0 "大家已经看得够多了。"
  DOMCOM_UI_053_NOTE:0 "每个被认可的绿帽奴都会获得绰号 #N戴绿帽者#!。其亲生子女将获得 #N绿帽奴之后#! 负面特质（全部六项能力-2）。#V嘲讽绿帽奴#!在建立支配前可用，可引发非致命荣誉决斗或公开拒绝，提供另一条获取绿帽经验的途径。"
  domcom.700.t:0 "网络开启"
  domcom.700.desc:0 "[domcom_intelligence_subject.GetShortUINamePossessive]的网络交出了它所掌握的情报。所有目前能够触及、属于[domcom_intelligence_subject.GetHerHim]、[domcom_intelligence_subject.GetHerHis]封臣和次级封臣的秘密——以及对于国王或皇帝而言，[domcom_intelligence_subject.GetHerHis]宫廷中的秘密——都已向我揭露。\n\n#high 知道秘密意味着拥有筹码，但还不是牵制。#! 现在我可以对知道其秘密的角色使用 CK3 的#bold 勒索#!互动；符合条件的秘密随后可以按照正常游戏规则转化为牵制。"
  domcom.700.desc.feminized:0 "[domcom_intelligence_subject.GetShortUIName]仍然戴着等级、头衔和宫廷尊严，但彻底陷入陷害的公开改造让我没有什么兴趣隐瞒任何事情。[domcom_intelligence_subject.GetHerHis|U]网络在没有有意义的阻力的情况下打开，揭示了系统可以暴露的每个当前可触及的秘密。 \n \n#high知道秘密是杠杆，但还不是钩子。#!"
  domcom.700.a:0 "先掌握情报，再掌握筹码。"
  trait_domcom_endowment_micro:0 "微小阴茎"
  trait_domcom_endowment_micro_desc:0 "[GetPlayer.Custom('DomcomMicroBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_micro_character_desc:0 "#V 测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 类别：#! 微小阴茎\n#italic 小到一旦被看到便无法忽视。#!\n#P 可遗传身体档案#!"
  trait_domcom_endowment_small:0 "小阴茎"
  trait_domcom_endowment_small_desc:0 "[GetPlayer.Custom('DomcomSmallBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_small_character_desc:0 "#V测量值：#![ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]长 ×[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]周长 \n#V类别：#!小额捐赠 \n#italic规模适中，几乎没有夸大的余地。#!\n#P可遗传的身体特征#!"
  trait_domcom_endowment_average:0 "平均阴茎"
  trait_domcom_endowment_average_desc:0 "[GetPlayer.Custom('DomcomAverageBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_average_character_desc:0 "#V测量值：#![ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]长 ×[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]周长 \n#V类别：#!平均禀赋 \n#italic比例熟悉，其他各方面都很独特。#!\n#P可遗传的身体特征#!"
  trait_domcom_endowment_big:0 "大阴茎"
  trait_domcom_endowment_big_desc:0 "[GetPlayer.Custom('DomcomBigBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_big_character_desc:0 "#V尺寸：#![ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]长 ×[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]周长 \n#V类别：#!大捐赠 \n#italic即使一眼望去，也明显高于普通。#!\n#P可遗传的身体特征#!"
  trait_domcom_endowment_hung:0 "粗大"
  trait_domcom_endowment_hung_desc:0 "[GetPlayer.Custom('DomcomHungBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_hung_character_desc:0 "#V尺寸：#![ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]长 ×[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]周长 \n#V类别：#!悬挂捐赠 \n#italic难以隐藏，更难以忽视。#!\n#P可遗传的身体特征#!"
  trait_domcom_endowment_massive:0 "巨大阴茎"
  trait_domcom_endowment_massive_desc:0 "[GetPlayer.Custom('DomcomMassiveBandDesc')]\n#P 可遗传身体档案#!"
  trait_domcom_endowment_massive_character_desc:0 "#V测量值：#![ROOT.GetCharacter.MakeScope.ScriptValue('domcom_length_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]长 ×[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_girth_display_value')|2][ROOT.GetCharacter.Custom('DomcomMeasurementUnit')]周长 \n#V类别：#!巨额捐赠 \n#italic不，这并不难。是的，它确实是这么大而柔软。#!\n#P可遗传的身体特征#!"
  trait_domcom_endowment_mastery_1:0 "天赋掌握 I — 启动"
  trait_domcom_endowment_mastery_1_desc:0 "获得#V3 精通 XP#!。授予#P+2 吸引力意见#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  trait_domcom_endowment_mastery_2:0 "天赋掌握 II — 已练习"
  trait_domcom_endowment_mastery_2_desc:0 "获得#V8 精通 XP#!。授予#P+4 吸引力意见#!和#P+1 外交#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  trait_domcom_endowment_mastery_3:0 "天赋掌握 III — 熟练"
  trait_domcom_endowment_mastery_3_desc:0 "获得#V13 精通 XP#!。授予#P+6 吸引力意见#!、#P+1 外交#!和#P+1 阴谋#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  trait_domcom_endowment_mastery_4:0 "天赋掌握 IV — 已完成"
  trait_domcom_endowment_mastery_4_desc:0 "获得#V20 精通 XP#!。授予#P+8 吸引力意见#!、#P+2 外交#!、#P+1 阴谋#!、#P+1 英勇#!和#P+5% 每月声望#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  trait_domcom_endowment_mastery_5:0 "天赋精通 V — 精通"
  trait_domcom_endowment_mastery_5_desc:0 "在#V27 点精通 XP#!处获得。奖励#P+10 吸引力好感#!、#P+2 外交#!、#P+2 阴谋#!、#P+2 英勇#!、#P+10% 每月声望#!和#P+5% 恐惧增益#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  trait_domcom_endowment_mastery_6:0 "天赋精通 VI — 传奇"
  trait_domcom_endowment_mastery_6_desc:0 "仅在#V32 / 32#!精通上限时获得。奖励#P+15 吸引力好感#!、#P+3 外交#!、#P+3 阴谋#!、#P+3 英勇#!、#P+15% 每月声望#!和#P+10% 恐惧增益#!。当正统性适用时，首次达到此等级会将正统性提高一个阶段。"
  domcom_mastery_rank_0:0 "未评级"
  domcom_mastery_rank_1:0 "I 级——入门"
  domcom_mastery_rank_2:0 "II 级——熟练"
  domcom_mastery_rank_3:0 "III 级——能手"
  domcom_mastery_rank_4:0 "IV 级——精通"
  domcom_mastery_rank_5:0 "V 级——大师"
  domcom_mastery_rank_6:0 "VI 级——传奇"
  domcom_endowment_mastery_rank_up_toast:0 "天赋掌握高级"
  trait_domcom_prefers_endowment_micro:0 "偏好微小阴茎"
  trait_domcom_prefers_endowment_micro_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_micro_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 微小阴茎\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  trait_domcom_prefers_endowment_small:0 "偏好小型"
  trait_domcom_prefers_endowment_small_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_small_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 小型\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  trait_domcom_prefers_endowment_average:0 "偏好平均"
  trait_domcom_prefers_endowment_average_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_average_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 平均\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  trait_domcom_prefers_endowment_big:0 "偏好大型"
  trait_domcom_prefers_endowment_big_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_big_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 大型\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  trait_domcom_prefers_endowment_hung:0 "偏好粗大"
  trait_domcom_prefers_endowment_hung_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_hung_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 粗大\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  trait_domcom_prefers_endowment_massive:0 "偏好巨大"
  trait_domcom_prefers_endowment_massive_desc:0 "该角色具有永久的个人天赋偏好。将鼠标悬停在特征上即可查看确切的首选长度和周长。"
  trait_domcom_prefers_endowment_massive_character_desc:0 "#V 偏好测量值：#! [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_length_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 长 × [ROOT.GetCharacter.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|2] [ROOT.GetCharacter.Custom('DomcomMeasurementUnit')] 围\n#V 偏好：#! 巨大\n\n可见类别根据这些精确测量值，并使用与身体相同的长度优先尺寸档次计算。吸引力会比较保存的精确尺寸，因此即使两人属于同一大类，契合度仍可能不同。"
  DOMCOM_UI_055_NOTE:0 "禀赋表现为正常的身体特征：小阴茎、小鸡巴、平均阴茎、大鸡巴、雄鸡或大鸡巴。将鼠标悬停在特征上即可查看准确的长度和周长。刷新圣餐分类帐会在现有保存中初始化/迁移成年男性的这些特征。"
  DOMCOM_UI_PERFORMANCE_NOTE:0 "账簿不会扫描所有在世角色。已有存档会通过正常游戏脉冲自动初始化有地统治者以及玩家可见范围内的角色，其他成年人会在与其产生关联时按需初始化。"
  domcom_fellow_cucked_offset_opinion:0 "伙计戴上帽子"
