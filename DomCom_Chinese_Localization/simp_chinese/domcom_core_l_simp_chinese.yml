  domcom_preference_cat_small:0 "@domcom_资质_较小_行内！小的"
  domcom_preference_cat_average:0 "@domcom_资质_普通_行内！平均的"
  domcom_preference_cat_big:0 "@domcom_资质_较大_行内！大的"
  domcom_preference_cat_hung:0 "@domcom_资质_雄伟_行内！洪"
  domcom_preference_cat_massive:0 "@domcom_资质_巨型_行内！大量的"
  domcom_preference_cat_unknown:0 "未分类"
  domcom_blood_succession_war_white_peace_desc:0 "支配权继承战争在没有强制执行的情况下结束。"
  domcom_blood_succession_war_invalidated_desc:0 "支配机制继承要求不再有效，战争结束。"
  trait_domcom_feminized_trait:0 "女性化"
  trait_domcom_feminized_trait_desc:0 "永久性的男性彻底陷入地位：政治立场可能保留，但赞助人公开重塑了这个角色的形象和社会地位。生育能力降低85%。"
  trait_domcom_feminized_trait_character_desc:0 "这个人在彻底陷入政治困境后被留在了自己的政治立场上，但他的赞助人永久地重塑了他的公众地位和形象。 \n \n#V最终状态：#!女性化 \n#V绿帽 经验：#!1000 / 1000 \n#V生育力：#!#N-85%#!\n#V赞助人：#![ROOT.GetCharacter.MakeScope.Var('domcom_feminized_by').GetCharacter.GetShortUIName]\n \n 状态是永久的。肖像变化是最好的修饰层；这个特质本身就是权威的。"
  domcom_feminized_submission_modifier:0 "支配机制重制"
  domcom_feminized_submission_modifier_desc:0 "彻底陷破了普通的抵抗。这种性格在政治上仍然存在，但对独立抵抗的大胆和复仇受到严重压制。"
  domcom_feminized_public_display_modifier:0 "以改造后的身份示人"
  domcom_feminized_public_display_modifier_desc:0 "赞助人最近迫使这个角色的女性化表现重新回到公众视野，重新增加了社会和声望成本。"
  domcom_feminized_patron_opinion:0 "由我的赞助人重制"
  domcom_feminized_display_opinion:0 "强迫我重新示人"
  nick_domcom_the_remade:0 "改造者"
  nick_domcom_the_unmanned:0 "去势者"
  nick_domcom_the_softened:0 "柔化者"
  domcom_enforce_feminized_presentation_interaction:0 "强制改变形象"
  domcom_enforce_feminized_presentation_interaction_desc:0 "在公共场合重申[recipient.GetShortUINamePossessive]永久女性化地位。这不会创建新的进展轨迹；它更新了彻底陷陷时所施加的可见的羞辱和表现。"
  domcom_enforce_feminized_presentation_tt:0 "[recipient.GetShortUIName]在彻底陷入陷害的演示文稿中被公开展示了三年，失去了威望并遭受了新的社会惩罚。"
  domcom_feminized_presentation_toast:0 "当你重塑他时，王国会看到他"
  rule_domcom_ai_activity:0 "支配机制：AI活动"
  rule_domcom_ai_activity_desc:0 "控制人工智能赞助人规则允许的人工智能统治者发起自主控制机制行为的频率，以及脚本化的政治反应升级为遏制战争的容易程度。它改变意图和升级频率，而不是底层的阿尔法成功计算。"
  setting_domcom_ai_activity_conservative:0 "保守"
  setting_domcom_ai_activity_conservative_desc:0 "人工智能支配机制发展缓慢。一般阿尔法机会和关系接管的频率大大降低，人工智能女性化更加罕见，符合条件的人类人工智能政治反应只有 1% 的遏制战争结果；在战争真正开始之前，响应者还必须处于和平状态，并且至少与目标一样强大。"
  setting_domcom_ai_activity_standard:0 "标准"
  setting_domcom_ai_activity_standard_desc:0 "默认。保持预期的自主节奏，同时减少军事升级：符合条件的“AI 中的人类”政治回应有 5% 的遏制战争结果概率。回应者必须处于和平状态且实力至少不弱于目标，之后目标有 10 年冷却时间，进攻者有 15 年冷却时间。"
  setting_domcom_ai_activity_aggressive:0 "激进"
  setting_domcom_ai_activity_aggressive_desc:0 "AI 赞助人更频繁地挑战，可以进行额外的关系控制机制尝试，更容易羞辱受试者，并更频繁地选择女性化。符合条件的人类在人工智能政治反应中使用 10% 的遏制战争结果，仍然受到强度限制并受到较长冷却时间的限制。"
  setting_domcom_ai_activity_chaotic:0 "混乱"
  setting_domcom_ai_activity_chaotic_desc:0 "最大的背景戏剧。符合资格的人工智能赞助人每年都会收到第二次关系控制机制尝试，在目标/成功检查之前获得 100% 的一般阿尔法机会，并大幅提高终端/羞辱活动。根据符合条件的政治反应，遏制战争升级率上升至 15%，但仍受实力限制并尊重长期战争冷却时间。"
  rule_domcom_cuck_autonomy:0 "控制机制：绿帽 自主与恢复"
  rule_domcom_cuck_autonomy_desc:0 "控制公开的 被戴绿帽 角色是否可以自我恢复、被戴绿帽 AI 保留多少主动权，以及独立挑衅的 被戴绿帽 是否愿意组织一场针对其赞助人的联盟战争。拥有的臣民永远不会仅仅通过伤害第三方来逃脱他们的赞助人。"
  setting_domcom_cuck_autonomy_static:0 "静态"
  setting_domcom_cuck_autonomy_static_desc:0 "通过成功的控制机制无法清除公共被扣状态。被卡住的 AI 角色的主动性大约降低 90%，有组织的反抗战争极为罕见。显式清理或其他编写的决议可能仍会清除状态。"
  setting_domcom_cuck_autonomy_standard:0 "标准"
  setting_domcom_cuck_autonomy_standard_desc:0 "默认。被卡住的人工智能角色的主动性降低了 75%，并且有组织的反抗在战争冷却时间较长的情况下仍然保守。一个非拥有的 绿帽 建立了对另一个 绿帽 的全面控制机制，消除了公众的耻辱，并获得两年的宽限期；拥有的胜利者会移除 200 绿帽 XP。"
  setting_domcom_cuck_autonomy_dynamic:0 "动态"
  setting_domcom_cuck_autonomy_dynamic_desc:0 "更多社会运动。尽管联盟战争仍然有多年的冷却时间，但被卡住的人工智能角色的主动性仅减少了 50%，并且更愿意组织反抗。成功康复有一年的宽限期，拥有的胜利者可以收回 350 个 绿帽 XP，而不是 200 个。"
  rule_domcom_passive_progression:0 "控制机制：被动进展"
  rule_domcom_passive_progression_desc:0 "控制由持续受到损害的家庭每月自动创建的 绿帽 XP：活跃的亲密关系、深度奉献和赞助儿童。手册阿尔法检查、羞辱、生育和其他明确的奖励不变。"
  setting_domcom_passive_progression_manual:0 "手动"
  setting_domcom_passive_progression_manual_desc:0 "由于持续的家庭状况，每月不再有 绿帽 XP。进度来自明确的动作/事件，更接近旧的按钮驱动的控制机制体验。"
  setting_domcom_passive_progression_reduced:0 "降低"
  setting_domcom_passive_progression_reduced_desc:0 "当前情况产生的 绿帽 XP 大约是正常被动 绿帽 XP 的一半。"
  setting_domcom_passive_progression_standard:0 "标准"
  setting_domcom_passive_progression_standard_desc:0 "默认。每个月，积极妥协的亲密关系可以增加 5 绿帽 XP、深度配偶奉献度 3 和家庭中的赞助人孩子 2。"
  setting_domcom_passive_progression_accelerated:0 "加速"
  setting_domcom_passive_progression_accelerated_desc:0 "持续的情况很快就会成熟：正常的每月被动 绿帽 XP 来源增加了一倍。"
  rule_domcom_notifications:0 "控制机制：通知"
  rule_domcom_notifications_desc:0 "控制成功的前景/彻底陷陷活动对人类玩家的干扰程度。除非特意解决，否则所有潜在客户仍可在共享账本中找到。"
  setting_domcom_notifications_minimal:0 "最少"
  setting_domcom_notifications_minimal_desc:0 "只有排队的最终崩溃才会对季度控制脉冲产生影响。新的浪漫/性前景保持沉默，并保留在分类帐中供您手动检查。"
  setting_domcom_notifications_strategic:0 "战略"
  setting_domcom_notifications_strategic_desc:0 "默认。最终的崩溃和真正有价值的前景被批量化为一个季度的脉冲。战略前景包括强大的先天素质和国王级或更高的政治/继任机会。"
  setting_domcom_notifications_everything:0 "全部"
  setting_domcom_notifications_everything_desc:0 "恢复高关注度风格：每一个成功的潜在客户都会开启其个人的接近事件，一旦准备就绪，彻底陷入陷害事件就会开启。大规模/全局扫描后预计会出现事件垃圾邮件。"
  rule_domcom_capitulation:0 "支配机制：投降"
  rule_domcom_capitulation_desc:0 "控制受臣服角色攻击其庇护者并在庇护者防御时屈服时所支付的额外支配代价。宣战理由的正常战争结果始终会正常结算。"
  setting_domcom_capitulation_vanilla:0 "原版战争结果"
  setting_domcom_capitulation_vanilla_desc:0 "无额外支配赔偿。臣服仅以有利于防御者的结局结束战争，即使该宣战理由没有给庇护者任何物质奖励。"
  setting_domcom_capitulation_indemnities:0 "赔偿"
  setting_domcom_capitulation_indemnities_desc:0 "默认。防守提交需要攻击者金库的 25% 最多 500 金币，10% 的声望最多 300 点，并增加 100 绿帽 XP。"
  setting_domcom_capitulation_harsh:0 "严厉臣服"
  setting_domcom_capitulation_harsh_desc:0 "叛逆的攻击者需要支付 50% 的金库，最多 1,000 金币，20% 的声望，最多 600 点，并在向其防御守护者投降时遭受 200 绿帽 XP。"
  DOMCOM_UI_AUDIT_RECORDS:0 "审计支配机制记录"
  DOMCOM_UI_AUDIT_RECORDS_TT:0 "从存留的支配机制状态中重建丢失的绿帽注册表项，然后使用当前完整性规则重新评估“被戴绿帽/被拥有”关系记录。不可能的自我归因将被移除。目前的合法同居配偶不会仅仅因为共有同一配偶/伴侣而被视为通奸者。具有强有力支配证据的历史记录将被保留。"
  DOMCOM_AUDIT_MIGRATION_TOAST:0 "调节支配机制记录：已修复[GetPlayer.MakeScope.Var('domcom_audit_self_invalid').GetValue|0]自我归因和[GetPlayer.MakeScope.Var('domcom_audit_cospouse_removed').GetValue|0]不受支持的共同配偶归因。"
  domcom.940.t:0 "治理机制 审计记录"
  domcom.940.desc:0 "账本已根据当前关系图进行了核对。 \n \n 不可能的自我归因已修复：#P[GetPlayer.MakeScope.Var('domcom_audit_self_invalid').GetValue|0]#!\n 删除了不受支持的合法同居伴侣属性：#P[GetPlayer.MakeScope.Var('domcom_audit_cospouse_removed').GetValue|0]#!\n 由于强有力的控制机制证据仍然存在而保留了不明确/历史的同居伴侣记录：#V[GetPlayer.MakeScope.Var('domcom_audit_cospouse_preserved').GetValue|0]#!\n \n 合法的多重婚姻本身并不创造新的通奸行为。历史上现存的通奸行为并不会仅仅因为当事人后来成为同居伴侣而被抹去。"
  domcom.940.a:0 "保留历史；消除不可能的事情。"
  DOMCOM_UI_NETWORK_INTELLIGENCE:0 "支配机制 情报"
  DOMCOM_UI_NETWORK_INTELLIGENCE_NOTE:0 "可通过该对象当前网络获得的秘密。"
  DOMCOM_UI_ROW_DOMINION_STATUS:0 "控制机制网络活跃"
  DOMCOM_UI_LICK_TITLE:0 "舔舐顶端"
  DOMCOM_UI_LICK_FLAVOR:0 "无法区分服从和安静的怨恨的支配机制只是猜测。召集家族和王国进行一项故意羞辱性的忠诚度测试，并记录谁在被要求在公开场合证明服从时服从。"
  DOMCOM_UI_LICK_SCOPE:0 "#V 上次测试对象：#! [GetPlayer.MakeScope.Var('domcom_lick_total_count').GetValue|0] 名成年人——我的宫廷成员、我的直属封臣，以及这些直属封臣的宫廷成员。访客和儿童不计入。"
  DOMCOM_UI_LICK_CALL:0 "召集忠诚测试"
  DOMCOM_UI_LICK_CALL_TT:0 "立即测试每个符合条件的成年人。每个人都会根据我的意见、我的恐惧、现有的支配机制、个性、落地的独立性、累积的忠诚度 XP 和最近的反抗来投掷个人顺从机会。成功的参与者将获得个性化的随机数量的忠诚度经验值。该测试可以每四个月调用一次（每年最多调用三次）。"
  DOMCOM_UI_LICK_READY:0 "#P 忠诚测试可用#!"
  DOMCOM_UI_LICK_COOLDOWN:0 "#N 忠诚测试处于四个月冷却期#!"
  DOMCOM_UI_LICK_LAST_TEST_TITLE:0 "上次忠诚测试"
  DOMCOM_UI_LICK_RESULTS:0 "#V 上次测试：#! #P [GetPlayer.MakeScope.Var('domcom_lick_complied_count').GetValue|0] 人服从#!   •   #N [GetPlayer.MakeScope.Var('domcom_lick_refused_count').GetValue|0] 人拒绝#!   •   拒绝的直属封臣：#N [GetPlayer.MakeScope.Var('domcom_lick_vassal_refused_count').GetValue|0]#!   •   拒绝的宫廷成员：#N [GetPlayer.MakeScope.Var('domcom_lick_courtier_refused_count').GetValue|0]#!"
  DOMCOM_UI_LICK_NO_RESULTS:0 "尚未进行忠诚度测试。调用测试来评估我领域内符合条件的成年人，并记录个人的遵守和拒绝结果。"
  DOMCOM_UI_LICK_ROSTER_TITLE:0 "上次忠诚测试——结果名册"
  DOMCOM_UI_LICK_CHANCE_HEADER:0 "服从率 %"
  DOMCOM_UI_LICK_RESULT_HEADER:0 "上次结果"
  DOMCOM_UI_LICK_RANGE:0 "显示 [GetPlayer.MakeScope.Var('domcom_ui_lick_shown_from').GetValue|0]–[GetPlayer.MakeScope.Var('domcom_ui_lick_shown_to').GetValue|0] / 共 [GetPlayer.MakeScope.Var('domcom_ui_lick_total').GetValue|0] 名受测者"
  DOMCOM_UI_LICK_PAGE_OF:0 "第 [GetPlayer.MakeScope.Var('domcom_ui_lick_page_display').GetValue|0] / [GetPlayer.MakeScope.Var('domcom_ui_lick_pages_display').GetValue|0] 页"
  DOMCOM_UI_LICK_ROW_CHANCE:0 "[Character.MakeScope.Var('domcom_lick_last_chance').GetValue|0]%"
  DOMCOM_UI_LICK_COMPLIED:0 "已服从"
  DOMCOM_UI_LICK_REFUSED:0 "已拒绝"
  DOMCOM_UI_LICK_UNTESTED:0 "未测试"
  DOMCOM_UI_LICK_ROLE_COURTIER:0 "我的宫廷成员"
  DOMCOM_UI_LICK_ROLE_VASSAL:0 "直属封臣"
  DOMCOM_UI_LICK_ROLE_VASSAL_COURTIER:0 "直属封臣的朝臣"
  DOMCOM_UI_LICK_NOTE:0 "#weak仅当此页面打开时，名册才存在。默认情况下，拒绝者优先排序。忠诚度在 25/50/75 XP 时增强，并在 100 时达到永久政治约束状态。#!"
  DOMCOM_LICK_TEST_TOAST:0 "王国已经通过了忠诚度测试"
  DOMCOM_UI_LICK_SORT_LABEL:0 "排序："
  DOMCOM_UI_LICK_SORT_STATUS:0 "结果"
  DOMCOM_UI_LICK_SORT_STATUS_TT:0 "默认：先显示拒绝者，然后在每个结果组内按忠诚经验从高到低排列。"
  DOMCOM_UI_LICK_SORT_OATHS:0 "忠诚"
  DOMCOM_UI_LICK_SORT_CHANCE:0 "概率"
  DOMCOM_UI_LICK_SORT_OPINION:0 "好感度"
  DOMCOM_UI_LICK_OATH_HEADER:0 "忠诚经验"
  DOMCOM_UI_LICK_ROW_OATHS:0 "[Character.MakeScope.Var('domcom_lick_loyalty_xp').GetValue|0]/100"
  DOMCOM_UI_LICK_ROW_XP_TT:0 "当前对赞助人的政治忠诚度 XP。最后一次成功的测试增益：+[Character.MakeScope.Var('domcom_lick_last_xp_gain').GetValue|0]。个性、观点、亲密关系和现有的支配机制都会影响获得的金额。"
  DOMCOM_UI_LICK_BOUND:0 "已绑定"
  domcom_take_collapsed_as_slave_interaction:0 "收为奴隶"
  domcom_take_collapsed_as_slave_interaction_desc:0 "在彻底陷陷后将[recipient.GetShortUIName]绑定到我的编号从线中。这将他们已解决的 绿帽 提交转换为最终的绝对服从，而不会撤消崩溃结果。他们的孩子继承了一代人对我的永久服从；孙辈不仅仅通过这种条件继承遗产。"
  DOMCOM_COLLAPSED_SLAVE_CREATED_TOAST:0 "一名败落的臣属进入了我的奴隶行列"
  DOMCOM_DIRECT_WAR_SUBMISSION_TOAST:0 "控制机制在战斗前打破他们的意志"
  domcom_inherited_submission_modifier:0 "继承的臣服"
  domcom_inherited_submission_modifier_desc:0 "一位家长进入了赞助人的编号奴隶行。该角色继承了一代人对该守护者的永久服从。这种情况不会自动遗传给他们自己的孩子。"
  domcom_lick_loyalty_tier_1:0 "立下誓言"
  domcom_lick_loyalty_tier_1_desc:0 "该角色公开回应了赞助人的忠诚仪式。第一个成功的行动已经产生了小小的政治依恋。"
  domcom_lick_loyalty_tier_2:0 "服从诏令"
  domcom_lick_loyalty_tier_2_desc:0 "反复的公开服从已经开始塑造这个角色对赞助人的政治本能。"
  domcom_lick_loyalty_tier_3:0 "忠于诏令"
  domcom_lick_loyalty_tier_3_desc:0 "赞助人的仪式权威已成为一种重要的政治忠诚，而不是一次性的羞辱。"
  domcom_lick_loyalty_tier_4:0 "献身于诏令"
  domcom_lick_loyalty_tier_4_desc:0 "这种性格强烈地反对对赞助人的政治蔑视，尽管这不是支配机制的奴隶制。"
  domcom_lick_loyalty_bound:0 "受诏令束缚"
  domcom_lick_loyalty_bound_desc:0 "忠诚度 XP 达到 100 时，该角色永久认可赞助人的政治权威，并自动回答该赞助人未来的舔舐臣服测试。"
  domcom_lick_loyalty_tier_1_opinion:0 "回应我的诏令"
  domcom_lick_loyalty_tier_2_opinion:0 "服从我的诏令"
  domcom_lick_loyalty_tier_3_opinion:0 "忠于我的诏令"
