  DOMCOM_UI_FILTER_KING:0 "国王以上"
  DOMCOM_UI_CUCKED_VISIBLE_COUNT:0 "显示[GetPlayer.MakeScope.Var('domcom_ui_cucked_count').GetValue|0]个跟踪的被卡住的字符中的#V[GetPlayer.MakeScope.Var('domcom_ui_filtered_cucked_count').GetValue|0]#!。"
  DOMCOM_UI_OWNED_VISIBLE_COUNT:0 "显示 #V [GetPlayer.MakeScope.Var('domcom_ui_filtered_owned_count').GetValue|0]#! / [GetPlayer.MakeScope.Var('domcom_ui_owned_count').GetValue|0] 名已占有臣属。"
  DOMCOM_UI_ROW_SKILLS:0 "@skill_diplomacy_icon![Character.GetSkill('diplomacy')|0]@skill_martial_icon![Character.GetSkill('martial')|0]@skill_stewardship_icon![Character.GetSkill('stewardship')|0]@skill_intrigue_icon![Character.GetSkill('intrigue')|0]@skill_learning_icon![Character.GetSkill('learning')|0]@skill_prowess_icon![Character.GetSkill('prowess')|0]"
