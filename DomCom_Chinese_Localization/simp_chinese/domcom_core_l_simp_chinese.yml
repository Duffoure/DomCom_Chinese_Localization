  domcom_override.endowment.guaranteed_tt:0 "#P保证等级。#!单击此按钮始终应用所选的捐赠类别。只有在类别#!内滚动的准确长度和周长#V是随机的； CK3 旧生成的“可能结果”百分比描述的是那些隐藏的测量结果，而不是该选择有效的机会。"
