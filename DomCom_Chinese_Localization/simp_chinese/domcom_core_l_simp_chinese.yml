  DOMCOM_UI_062_NOTE:0 "阿尔法 检查和性影响是不同的机制。同性阿尔法的胜利创造了交配前的杠杆作用或加强了交配后的支配机制。 挑逗遵循相互的方向并开始单独的 0-1000 奉献度轨道。恋人可以加深交流；在 1000 处，已知的赞助人会自动创建编号的绝对下游状态。"
  domcom_extreme_marital_aversion_modifier:0 "强烈婚姻厌恶"
  domcom_extreme_marital_aversion_modifier_desc:0 "该角色的私人吸引力档案与其配偶极不相容。婚姻本身已经成为压力来源，而对足够冷酷的人格而言，还可能演变成致命的怨恨。"
  domcom_extreme_marital_fixation_modifier:0 "婚姻执着"
  domcom_extreme_marital_fixation_modifier_desc:0 "这个角色的私人吸引力概况与他们的配偶非常吻合。固着很强烈，但欲望仍然与奉献不同。"
  rule_domcom_world_seed:0 "支配机制：现有-保存播种"
  rule_domcom_world_seed_desc:0 "控制当首次加载 模组 活动的保存时控制机制是否测量整个活人口。"
  domcom_world_seed:0 "支配机制：现有-保存播种"
  domcom_world_seed_desc:0 "控制当首次加载 模组 活动的保存时控制机制是否测量整个活人口。"
  setting_domcom_world_seed_on:0 "开启"
  setting_domcom_world_seed_on_desc:0 "受到推崇的。每个成年男子都会测量一次，然后就不会再测量一次。控制机制在未随 模组 启动的保存中正常工作所需。第一次加载时需要短暂暂停。"
  setting_domcom_world_seed_off:0 "关闭"
