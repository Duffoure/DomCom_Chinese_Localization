  domcom_endowment_average_desc_imperial:0 "平均通常指长度为 4.3–5.7 英寸；围度超过 5.5 英寸则会提升为较大。"
  domcom_endowment_average_desc_metric:0 "平均通常指长度为 10.92–14.48 厘米；围度超过 13.97 厘米则会提升为较大。"
  domcom_endowment_big_desc_imperial:0 "较大通常指长度为 5.8–6.7 英寸；围度超过 6.0 英寸则会提升为粗大。"
  domcom_endowment_big_desc_metric:0 "较大通常指长度为 14.73–17.02 厘米；围度超过 15.24 厘米则会提升为粗大。"
