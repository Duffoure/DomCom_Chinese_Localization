  domcom_owned_benefit_tier_2_modifier_desc:0 "对于 5-9 名活着的拥有臣民，支配机制每月授予 +50 声望、虔诚和声望。它还在登陆时每三个月授予 +3 正统性。"
  domcom_owned_benefit_tier_3_modifier:0 "收益率控制机制——第三级"
  domcom_owned_benefit_tier_3_modifier_desc:0 "拥有 10 个或以上活着的臣民时，支配机制每月可提供 +100 声望、虔诚和声望。它还在登陆时每三个月授予 +5 正统性。"
  domcom_cuck_stage_humiliated:0 "蒙受羞辱"
  domcom_cuck_stage_submissive:0 "顺从"
  domcom_cuck_stage_broken:0 "破碎"
  domcom_cuck_stage_abject:0 "卑微"
  domcom_cuck_stage_final:0 "彻底沦陷"
  domcom_cuck_next_submissive:0 "#V 下一阶段：#! 250 XP 时达到顺从"
  domcom_cuck_next_broken:0 "#V 下一阶段：#! 500 XP 时达到破碎"
  domcom_cuck_next_abject:0 "#V 下一阶段：#! 750 XP 时达到卑微"
  domcom_cuck_next_final:0 "#V下一个：#!在 1000 XP 时彻底陷陷"
  domcom_cuck_next_terminal:0 "#P 已达到最终阶段。#!"
  domcom_obedience_devoted_modifier:0 "被诱惑——忠诚"
  domcom_obedience_devoted_modifier_desc:0 "奉献度：#V[ROOT.GetCharacter.MakeScope.ScriptValue('domcom_obedience_display_value')|0]/ 1000#!。现在，这种关系对忠诚度、信息和行动意愿产生了有意义的影响。"
  domcom_devotion_ready_modifier:0 "奉献完成"
  domcom_devotion_ready_modifier_desc:0 "奉献度：#V1000 / 1000#!。奉献轨道已完成，但此遗留保存仍然缺少赞助人指针。现在，当赞助人可以重建时，刷新账本会立即修复终端身份。"
  domcom_obedience_devoted_hard_modifier:0 "被诱惑——忠诚"
  domcom_obedience_devoted_hard_modifier_desc:0 "奉献精神在这个角色的优先事项中变得显而易见。他们自己的地位受到损害，而他们对关系的作用却在增加。"
  domcom_devoted_network_modifier:0 "忠诚网络"
  domcom_devoted_network_modifier_desc:0 "一位深情投入的情人正在提供信息并帮助制定个人计划。"
  domcom_devotion_proven_support_modifier:0 "奉献精神得到证实"
  domcom_devotion_proven_support_modifier_desc:0 "《情人》最近在一次具体的忠诚测试中支持了这个角色。"
  domcom_counter_alpha_defeat_modifier:0 "逆阿尔法失败"
  domcom_counter_alpha_defeat_modifier_desc:0 "阿尔法对抗逆转并以该角色在公开场合或身体上被击败而告终。"
  domcom_deepen_communion_good_opinion:0 "理解了我"
  domcom_deepen_communion_bad_opinion:0 "误解了我"
  domcom_pet_claim_rejected_opinion:0 "逼得太紧"
  domcom_communion.100.t:0 "加深交流：选择一起的时间"
  domcom_communion.100.desc:0 "你与[scope:domcom_communion_target.GetShortUIName]独处了一段时间。现在，决定你们共同做什么：一起进行竞争、身体上的互动，或者只是全心全意地陪伴[scope:domcom_communion_target.GetHerHim]。"
  domcom_communion.100.desc.ambitious:0 "[scope:domcom_communion_target.GetShortUIName]谈起[scope:domcom_communion_target.GetSheHe]仍想成为什么样的人，以及是谁一直挡在路上。"
  domcom_communion.100.desc.compassionate:0 "[scope:domcom_communion_target.GetShortUIName]承认，真正压在[scope:domcom_communion_target.GetHerHim]心头的并不是地位，而是那些[scope:domcom_communion_target.GetSheHe]觉得自己有责任照顾的人。"
  domcom_communion.100.desc.lustful:0 "与[scope:domcom_communion_target.GetShortUIName]的谈话不断偏离政治，又回到你们之间的吸引力上。"
  domcom_communion.100.a:0 "一起进行策略游戏。"
  domcom_communion.100.b:0 "一起切磋。"
  domcom_communion.100.c:0 "一起度过安静的夜晚。"
  domcom_communion.110.t:0 "加深交流：读懂他们的世界"
  domcom_communion.110.desc.related:0 "不久，[scope:domcom_communion_target.GetShortUIName]提起[scope:domcom_communion_related.GetShortUIName]。重要的是，你是否理解这段关系对[scope:domcom_communion_target.GetHerHim]究竟意味着什么。"
  domcom_communion.110.desc.realm:0 "谈话转向外部——职责、等级，以及[scope:domcom_communion_target.GetShortUIName]在与你分别后必须回归的生活。"
  domcom_communion.110.a:0 "那段关系对你很重要。保护它。"
  domcom_communion.110.b:0 "利用这段关系，而不是让它利用你。"
  domcom_communion.110.c:0 "告诉我你真正想从他们那里得到什么。"
  domcom_communion.120.t:0 "加深交流：请阅读我们"
  domcom_communion.120.desc:0 "最终，[scope:domcom_communion_target.GetShortUIName]不再谈论其他人。问题更简单，也更困难：你们两人究竟正在成为怎样的关系？"
  domcom_communion.120.a:0 "稳定的关系。我不会把你当成可以随意丢弃的人。"
  domcom_communion.120.b:0 "别假装我们之间的欲望无关紧要。"
  domcom_communion.120.c:0 "最终你必须选择自己的忠诚归属。"
  domcom_communion.130.t:0 "圣社关系加深"
  domcom_communion.130.desc.exceptional:0 "你几乎完美地读懂了[scope:domcom_communion_target.GetShortUIName]。谈话让[scope:domcom_communion_target.GetHerHim]感到自己被看见，而不仅仅是被渴望。"
  domcom_communion.130.desc.strong:0 "你对[scope:domcom_communion_target.GetShortUIName]的理解足够深入，使这段关系明显更加亲密。"
  domcom_communion.130.desc.mixed:0 "你说的一些话打动了对方，另一些没有。即便如此，这段关系仍在继续发展。"
  domcom_communion.130.desc.failed:0 "你对[scope:domcom_communion_target.GetShortUIName]的误解严重到让这次尝试造成了距离，而非亲近。"
  domcom_communion.130.a:0 "我会记住这一点。"
  domcom_communion.200.t:0 "测试投入"
  domcom_communion.200.desc:0 "[scope:domcom_communion_target.GetShortUIName]已经深深依恋你。依恋很容易说出口。现在你可以提出一些代价足够大、能够证明这份依恋的要求。"
  domcom_communion.200.a:0 "把你们家族知道的事情带给我。"
  domcom_communion.200.a.tt:0 "如果接受，[scope:domcom_communion_target.GetShortUIName]会泄露个人和配偶的秘密并获得奉献度。"
  domcom_test_devotion_tt_success:0 "奉献测试成功。"
  domcom_test_devotion_tt_failure:0 "奉献测试被抵制。"
  domcom_communion.200.b:0 "把我置于你的家庭之前。"
  domcom_communion.200.b.tt:0 "如果接受，任何已经被你操过的配偶都会获得额外的操练经验，并且情人会获得更多的忠诚度。"
  domcom_communion.200.c:0 "当我对付其他人时站在我这边。"
  domcom_communion.200.c.tt:0 "如果接受，将获得两年的个人计划支持修正和额外的奉献度。"
  domcom_communion.200.d:0 "我只是需要知道你会这么做。"
  domcom_communion.210.t:0 "奉献精神得到证实"
  domcom_communion.210.desc:0 "[scope:domcom_communion_target.GetShortUIName]完成了你的要求。无论这段关系究竟是什么，它现在都有了证明。"
  domcom_communion.210.a:0 "很好。"
  domcom_communion.211.t:0 "线路被拒绝"
  domcom_communion.211.desc:0 "[scope:domcom_communion_target.GetShortUIName]拒绝。这段关系得以维持，但拒绝暴露了你误认为奉献的限制。"
  domcom_communion.211.a:0 "那么我知道界线在哪里了。"
  domcom_communion.300.t:0 "遗产臣服宣称"
  domcom_communion.300.desc:0 "[scope:domcom_communion_target.GetShortUIName]已达到 1000 奉献度。剩下的问题是[scope:domcom_communion_target.GetSheHe]是否会接受您要求[scope:domcom_communion_target.GetHerHim]占据的最终位置。"
  domcom_communion.300.a:0 "要求最终承诺。"
  domcom_communion.300.b:0 "还没有。"
  domcom_claim_pet_tt_success:0 "最终臣服宣称已被接受。"
  domcom_claim_pet_tt_failure:0 "索赔被拒绝；奉献度回落至850。"
  domcom_communion.310.t:0 "绝对服从"
  domcom_communion.310.desc:0 "[scope:domcom_communion_target.GetShortUIName]接受了。关系变得永久，而编号王朝称号记录下[scope:domcom_communion_target.GetHerHis]在你王朝历史中的位置。"
  domcom_communion.310.a:0 "就这样吧。"
  domcom_communion.311.t:0 "没那么远"
  domcom_communion.311.desc:0 "[scope:domcom_communion_target.GetShortUIName]拒绝最终索赔。按下它会暴露电阻；奉献度回落至850。"
  domcom_communion.311.a:0 "那么我们还没有结束。"
  domcom_alpha.100.t:0 "阿尔法对抗：选择比赛"
  domcom_alpha.100.desc:0 "[scope:domcom_alpha_target.GetShortUIName]受到了挑战。决定什么才能真正解决这个问题：身体上的较量、策略游戏，还是你阿尔法地位背后的声望与筹码。"
  domcom_alpha.100.a:0 "以单挑解决。"
  domcom_alpha.100.b:0 "通过策略游戏解决。"
  domcom_alpha.100.c:0 "让地位和筹码决定结果。"
  domcom_alpha.110.t:0 "阿尔法对抗：答案"
  domcom_alpha.110.desc:0 "[scope:domcom_alpha_target.GetShortUIName]没有给出你预期的反应。你必须决定这场对抗将变成什么样。"
  domcom_alpha.110.desc.wrathful:0 "[scope:domcom_alpha_target.GetShortUIName]以愤怒回应愤怒。这场对抗已经比你们任何一方愿意承认的都更接近暴力。"
  domcom_alpha.110.desc.craven:0 "[scope:domcom_alpha_target.GetShortUIName]犹豫了。恐惧确实存在——但接下来你的行动可能让恐惧变成退缩，也可能变成绝望。"
  domcom_alpha.110.desc.arrogant:0 "[scope:domcom_alpha_target.GetShortUIName]嘲笑你竟认为自己有资格测试[scope:domcom_alpha_target.GetHerHim]。"
  domcom_alpha.110.a:0 "公开进行。让地位决定谁显得更弱小。"
  domcom_alpha.110.b:0 "找个私下的地方，让威胁更加明确。"
  domcom_alpha.110.c:0 "让[scope:domcom_alpha_supporter.GetShortUIName]替我们回答这个问题。"
  domcom_alpha.120.t:0 "阿尔法对抗：不归路"
  domcom_alpha.120.desc:0 "交锋范围已经缩小。[scope:domcom_alpha_target.GetShortUIName]要么让步，要么让你为强行推进此事付出代价。"
  domcom_alpha.120.a:0 "给[scope:domcom_alpha_target.GetHerHim]一个退让的机会。"
  domcom_alpha.120.b:0 "没有出口。强行提出问题。"
  domcom_alpha.120.c:0 "用我知道的事情将[scope:domcom_alpha_target.GetHerHim]逼入绝境。"
  domcom_alpha.130.t:0 "阿尔法对抗：分辨率"
  domcom_alpha.130.desc.success:0 "你的选择让对抗朝有利于你的方向发展。[scope:domcom_alpha_target.GetShortUIName]终于让步。"
  domcom_alpha.130.desc.failure:0 "你已经将事情推进到极限，但[scope:domcom_alpha_target.GetShortUIName]拒绝让步。失败仍可能带来后果。"
  domcom_alpha.130.a:0 "[scope:domcom_alpha_target.GetShortUIName]让步了。"
  domcom_alpha.130.b:0 "[scope:domcom_alpha_target.GetShortUIName]拒绝让步。"
  domcom_alpha.140.t:0 "抵抗仍在坚持"
  domcom_alpha.140.desc:0 "[scope:domcom_alpha_target.GetShortUIName]经受住了这次考验，让失败本身说明一切。你施压了，但[scope:domcom_alpha_target.GetSheHe]没有动摇。"
  domcom_alpha.140.a:0 "暂且如此。"
  domcom_alpha.150.t:0 "逆阿尔法"
  domcom_alpha.150.desc:0 "[scope:domcom_alpha_target.GetShortUIName]没有结束这场对抗，反而将其反转到你身上，要求你要么在身体上承担这次挑战，要么承认自己越界了。"
  domcom_alpha.150.a:0 "那就比试见真章。"
  domcom_alpha.150.b:0 "在事态恶化前退让。"
  domcom_alpha.160.t:0 "决一死战"
  domcom_alpha.160.desc:0 "失败的阿尔法对抗走向了更加丑陋的地方。[scope:domcom_alpha_target.GetShortUIName]非常愤怒，要求进行一场没有安全结局的决斗。"
  domcom_alpha.160.a:0 "那就决一死战。"
  domcom_alpha.160.b:0 "不。我宁愿承受这份屈辱。"
  domcom_alpha.100.a.tt:0 "启动 CK3 的完整#V非致命单人战斗#!系统。#P获胜：#!阿尔法对抗成功并适用正常的阿尔法奖励。#N失败：#!阿尔法对抗失败，抵抗后果适用。这条路线是由决斗本身决定的，而不是显示的阿尔法百分比。"
  domcom_alpha.100.b.tt:0 "启动 CK3 的完整#V策略棋盘游戏#!系统。#P获胜：#!阿尔法对抗成功。#N输：#!阿尔法对抗失败，除非[scope:domcom_alpha_target.GetShortUIName]将结果转变为反向阿尔法挑战。这条路线是由棋牌对弈决定的，而不是显示的阿尔法百分比。"
  domcom_alpha.100.c.tt:0 "直接使用显示的阿尔法计算：爵位、威望、军事头衔、外交、谋略、武勇、恐怖值、性格、绿帽证据以及现有的支配筹码均产生影响。失败的社交对抗可能会激怒具攻击性的对手，从而发起反向阿尔法决斗。"
  domcom_alpha.100.d:0 "在比赛开始前退出。"
  domcom_alpha.100.d.tt:0 "比赛开始前退出。#P没有阿尔法结果、冷却时间、津贴使用或尝试被消耗；您可以立即再次挑战该角色。#!"
  domcom_alpha.220.t:0 "逆阿尔法"
  domcom_alpha.220.desc:0 "[scope:domcom_alpha_target.GetShortUIName]拒绝让失败的挑战按照你的方式结束。[scope:domcom_alpha_target.GetSheHe|U]要求你在身体上回应这次反转，或者承认自己越界了。"
  domcom_alpha.220.desc.deadly:0 "[scope:domcom_alpha_target.GetShortUIName]拒绝让失败的挑战停留在言语或棋盘上的棋子层面。愤怒已经进一步升级：[scope:domcom_alpha_target.GetSheHe]愿意让鲜血为逆阿尔法作证。"
  domcom_alpha.220.a:0 "以单挑回应逆阿尔法。"
  domcom_alpha.220.a.tt:0 "开始 CK3 完整的#V 非致命单挑#!系统。#P 胜利：#!将失败路线逆转为阿尔法胜利。#N 失败：#!确认阿尔法挑战失败。"
  domcom_alpha.220.b:0 "接受生死决斗。"
  domcom_alpha.220.b.tt:0 "启动 CK3 的完整#N致命单战#!系统。失败者可能会死。如果你作为胜利者生存下来，阿尔法对抗就会成功。"
  domcom_alpha.220.c:0 "拒绝反向阿尔法并接受损失。"
  domcom_alpha.220.c.tt:0 "阿尔法对抗失败了。你会失去 300 点声望并承受正常的抵抗后果。"
  domcom_alpha.240.t:0 "阿尔法对抗 已解决"
  domcom_alpha.240.desc.success:0 "你的地位和影响力带来对抗。[scope:domcom_alpha_target.GetShortUIName]让步，阿尔法对抗获胜。"
  domcom_alpha.240.desc.failure:0 "你的地位和影响力还不够。[scope:domcom_alpha_target.GetShortUIName]拒绝屈服，阿尔法对抗失败。"
  domcom_alpha.240.a:0 "事情就此解决。"
  domcom_communion.100.a.tt:0 "启动 CK3 的完整#V策略棋盘游戏#!系统。#P如果您获胜：+120 奉献度。#!#V如果[scope:domcom_communion_target.GetShortUIName]获胜：+90 奉献度。#!耐心、勤奋、精明或欺诈的伴侣获得#P+25#!；灵魂伴侣额外获得#P+20#!。"
  domcom_communion.100.b.tt:0 "启动 CK3 的完整#V非致命单人战斗#!系统。#P如果您获胜：+130 奉献度。#!#V如果[scope:domcom_communion_target.GetShortUIName]获胜：+100 奉献度。#!勇敢、愤怒、运动或雄心勃勃的伙伴获得#P+25#!；灵魂伴侣额外获得#P+20#!。"
  domcom_communion.100.c.tt:0 "没有小游戏。获得#P+55 奉献度#!。富有同情心、冷静、满足、合群或好色的伴侣将获得#P+25#!；灵魂伴侣额外获得#P+20#!。"
  domcom_communion.100.d:0 "今晚不行。"
  domcom_communion.100.d.tt:0 "结束尝试而不改变奉献度。#P不消耗冷却时间；加深交流可以立即再次对该角色使用。#!"
  DOMCOM_COOLTIP_ENDOWMENT:0 "#V捐赠：#![Character.Custom('DomcomEndowmentCategory')]—[Character.MakeScope.ScriptValue('domcom_length_display_value')|1]×[Character.MakeScope.ScriptValue('domcom_girth_display_value')|1][Character.Custom('DomcomMeasurementUnit')]"
  DOMCOM_COOLTIP_PREFERENCE:0 "#V 偏好：#! [Character.Custom('DomcomPreferenceCategory')] — [Character.MakeScope.ScriptValue('domcom_preferred_length_display_value')|1] × [Character.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|1] [Character.Custom('DomcomMeasurementUnit')]"
  DOMCOM_COOLTIP_ENDOWMENT_LINE:0 "#V捐赠：#![Character.Custom('DomcomEndowmentCategory')]—[Character.MakeScope.ScriptValue('domcom_length_display_value')|1]×[Character.MakeScope.ScriptValue('domcom_girth_display_value')|1][Character.Custom('DomcomMeasurementUnit')]\n"
  DOMCOM_COOLTIP_MASTERY_LINE:0 "#V精通：#![Character.Custom('DomcomEndowmentMasteryRank')]—[Character.MakeScope.ScriptValue('domcom_endowment_mastery_xp_value')|0]/ 32 \n"
  DOMCOM_COOLTIP_PREFERENCE_LINE:0 "#V 偏好：#! [Character.Custom('DomcomPreferenceCategory')] — [Character.MakeScope.ScriptValue('domcom_preferred_length_display_value')|1] × [Character.MakeScope.ScriptValue('domcom_preferred_girth_display_value')|1] [Character.Custom('DomcomMeasurementUnit')]\n"
  DOMCOM_COOLTIP_EMPTY:0 ""
