  domcom_alpha.300.t:0 "世界阿尔法大赛结果"
  domcom_alpha.300.desc.champion:0 "#P您是世界阿尔法冠军。#!\n \n 种子挑战赛吸引了#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_field_size').GetValue|0]#!合格赞助人。您完成了#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]从#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_matches').GetValue|0]匹配#!赢#!。 \n \n#V您的阿尔法评级：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V冠军评级：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_champion_rating').GetValue|0]\n \n#V您的声望奖励：#!立即#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!；#P+70% 骑士效率#!、#P+30% 每月声望增益#!、#P+20% 恐惧增益#!和#P+10 恐惧基线#!（适用于#V） 1 年#!；在可能的情况下，合法性至少提高一级；您的文化还获得#P2 个随机可用创新#!。 \n \n#V冠军：#![domcom_world_tournament_result_champion.GetUIName]"
  domcom_alpha.300.desc.runner_up:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n _\n 您进入了冠军赛并在#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]赢得#!后获得#P亚军#!。#N[domcom_world_tournament_result_eliminator.GetUIName]#!结束了您的跑步。 \n \n#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#!_[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V您的获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% \n#V冠军评级：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_champion_rating').GetValue|0]• 场地：[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_field_size').GetValue|0]\n \n#V您的声望奖励：#!#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!和#P立即 +100 合法性#!；#P+50% 骑士效能#!、#P+20% 每月声望增益#!和#P+15% 恐惧增益#!，持续#V1 年#!；您的文化获得#P1 项随机可用创新#!。"
  domcom_alpha.300.desc.top_1:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n _\n 您进入了#P种子选手前 1%#!，并获得#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]获胜#!。#N[domcom_world_tournament_result_eliminator.GetUIName]#!淘汰了你。 \n \n#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#!_[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V您的获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% _\n _\n#V您的声望奖励：#!#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!和#P立即 +50 合法性#!；#P+35% 骑士效能#!、#P+15% 每月声望增益#!和#P+10% 恐惧增益#!，持续#V1 年#!；您的文化获得#P1 项随机可用创新#!。"
  domcom_alpha.300.desc.top_5:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n _\n 您进入了#P种子选手前 5%#!，并获得#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]获胜#!。#N[domcom_world_tournament_result_eliminator.GetUIName]#!淘汰了你。 \n \n#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#!_[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V您的获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% _\n _\n#V您的声望奖励：#!#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!立即；#P+20% 骑士效能#!、#P+10% 每月威望增益#!和#P+5% 恐惧增益#!，持续#V1 年#!。"
  domcom_alpha.300.desc.top_10:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n _\n 您进入了#P种子选手前 10%#!，并获得#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]获胜#!。#N[domcom_world_tournament_result_eliminator.GetUIName]#!淘汰了你。 \n \n#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#!_[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V您的获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% _\n _\n#V您的声望奖励：#!#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!立即；#P+10% 骑士效率#!和#P+5% 每月声望增益#!持续#V1 年#!。"
  domcom_alpha.300.desc.bracket:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n _\n 在#N[domcom_world_tournament_result_eliminator.GetUIName]#!结束运行之前，您在首轮种子赛中幸存下来，进入了大约#P最后八分之一的#!场。这将赢得较小的挑战资格赛资格。 \n \n 记录：#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]从#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_matches').GetValue|0]匹配#!赢得#!。#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% _\n _\n#V您的声望奖励：立即#!#P+[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_reward_prestige').GetValue|0]声望#!；#P+8% 骑士效能#!和#P+4% 每月声望增益#!持续#V1 年#!。"
  domcom_alpha.300.desc.eliminated:0 "#V世界阿尔法冠军：#![domcom_world_tournament_result_champion.GetUIName]\n \n#N[domcom_world_tournament_result_eliminator.GetUIName]#!在你达到挑战资格赛门槛之前就淘汰了你。 \n \n 记录：#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_wins').GetValue|0]从#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_matches').GetValue|0]中赢得#!，在#V[ROOT.Char.MakeScope.Var('domcom_world_tournament_last_field_size').GetValue|0]赞助人#!的字段中匹配#!。 \n#V您的评分：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_player_rating').GetValue|0]•#V淘汰者：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_eliminator_rating').GetValue|0]•#V您的获胜机会：#![ROOT.Char.MakeScope.Var('domcom_world_tournament_last_elimination_odds').GetValue|0]% \n \n#V您的声望奖励：#!无。"
